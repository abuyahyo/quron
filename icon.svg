<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0f5247"/>
      <stop offset="0.5" stop-color="#0a3a30"/>
      <stop offset="1" stop-color="#04221b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d489"/>
      <stop offset="0.5" stop-color="#d4a843"/>
      <stop offset="1" stop-color="#b07f2a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1de"/>
      <stop offset="1" stop-color="#ebdcbb"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- gold hairline frame -->
  <rect x="44" y="44" width="424" height="424" rx="78" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.55"/>

  <!-- 8-point star -->
  <g transform="translate(256 168)" fill="url(#gold)">
    <path d="M0 -38 L8.5 -8.5 L38 0 L8.5 8.5 L0 38 L-8.5 8.5 L-38 0 L-8.5 -8.5 Z"/>
    <path d="M0 -22 L15.6 -15.6 L22 0 L15.6 15.6 L0 22 L-15.6 15.6 L-22 0 L-15.6 -15.6 Z" opacity="0.85"/>
  </g>

  <!-- open book / mushaf -->
  <g>
    <!-- soft shadow under book -->
    <ellipse cx="256" cy="372" rx="150" ry="20" fill="#000000" opacity="0.18"/>

    <!-- left page -->
    <path d="M256 286 C212 272 168 266 134 272 L146 356 C178 350 218 352 256 366 Z"
          fill="url(#page)" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <!-- right page -->
    <path d="M256 286 C300 272 344 266 378 272 L366 356 C334 350 294 352 256 366 Z"
          fill="url(#page)" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <!-- spine -->
    <path d="M256 286 L256 366" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>

    <!-- text lines, left page -->
    <g stroke="#a9853c" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <path d="M168 296 L232 303"/>
      <path d="M160 312 L232 318"/>
      <path d="M158 328 L232 333"/>
    </g>
    <!-- text lines, right page -->
    <g stroke="#a9853c" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <path d="M280 303 L344 296"/>
      <path d="M280 318 L352 312"/>
      <path d="M280 333 L354 328"/>
    </g>
  </g>
</svg>
