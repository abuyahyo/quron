<style>
:root{
  /* Night sky — astronomical manuscript */
  --bg:#070b1c;
  --bg-2:#0a1028;
  --bg-deep:#040712;
  --surface:#0e1432;
  --surface-2:#131a3f;
  --surface-hi:#1a234d;
  --surface-elev:#202a5a;
  --border:rgba(212,175,55,.12);
  --border-hi:rgba(212,175,55,.28);
  --border-strong:rgba(212,175,55,.5);
  --divider:rgba(212,175,55,.08);
  --text:#ece5d0;
  --text-dim:#a4adcc;
  --text-mute:#6a7396;
  --gold:#d4af37;
  --gold-soft:rgba(212,175,55,.13);
  --gold-line:rgba(212,175,55,.35);
  --gold-bright:#f0c956;
  --gold-deep:#a37e1f;
  --silver:#c8d0e8;
  --header-bg:rgba(7,11,28,.78);
  --pop-bg:rgba(14,20,50,.97);
  --shadow-sm:0 1px 3px rgba(0,0,0,.6);
  --shadow-md:0 8px 28px rgba(0,0,0,.55);
  --shadow-card:0 4px 16px rgba(0,0,0,.4);
  --shadow-gold:0 4px 24px rgba(212,175,55,.18);
  --on-gold:#070b1c;
}

.light{
  /* Dawn parchment */
  --bg:#f4ebd6;
  --bg-2:#ede2c3;
  --bg-deep:#e3d6b1;
  --surface:#fcf7e9;
  --surface-2:#f5edd2;
  --surface-hi:#fffdf4;
  --surface-elev:#ffffff;
  --border:rgba(166,128,22,.2);
  --border-hi:rgba(166,128,22,.42);
  --border-strong:rgba(166,128,22,.6);
  --divider:rgba(166,128,22,.13);
  --text:#1a1f3d;
  --text-dim:#5b6485;
  --text-mute:#8c8466;
  --gold:#9a7212;
  --gold-soft:rgba(154,114,18,.12);
  --gold-line:rgba(154,114,18,.4);
  --gold-bright:#c79520;
  --gold-deep:#6b4f08;
  --silver:#5b6485;
  --header-bg:rgba(244,235,214,.85);
  --pop-bg:rgba(252,247,233,.98);
  --shadow-sm:0 1px 2px rgba(120,90,20,.08);
  --shadow-md:0 6px 22px rgba(120,90,20,.14);
  --shadow-card:0 2px 12px rgba(120,90,20,.1);
  --shadow-gold:0 4px 24px rgba(154,114,18,.18);
  --on-gold:#fffdf4;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--gold-deep) transparent}
html::-webkit-scrollbar{width:8px;height:8px}
html::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb{background:var(--gold-deep);border-radius:8px}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Lora','Iowan Old Style','Hoefler Text',Georgia,'Times New Roman',serif;
  font-size:15px;line-height:1.65;min-height:100vh;
  transition:background .25s,color .25s;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:"liga","kern";
}

/* Star pattern (night sky) — fixed background, hidden in light */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-2;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 600'><g fill='%23d4af37'><circle cx='40' cy='80' r='.8' opacity='.5'/><circle cx='110' cy='30' r='.6' opacity='.4'/><circle cx='180' cy='140' r='1.1' opacity='.6'/><circle cx='250' cy='60' r='.7' opacity='.4'/><circle cx='320' cy='190' r='.8' opacity='.5'/><circle cx='400' cy='40' r='.9' opacity='.55'/><circle cx='470' cy='110' r='.6' opacity='.4'/><circle cx='540' cy='70' r='1.2' opacity='.6'/><circle cx='80' cy='220' r='.7' opacity='.45'/><circle cx='150' cy='290' r='.9' opacity='.5'/><circle cx='230' cy='340' r='.6' opacity='.4'/><circle cx='310' cy='270' r='1' opacity='.55'/><circle cx='390' cy='320' r='.7' opacity='.45'/><circle cx='460' cy='250' r='.8' opacity='.5'/><circle cx='530' cy='310' r='.6' opacity='.4'/><circle cx='50' cy='380' r='1.1' opacity='.6'/><circle cx='130' cy='450' r='.7' opacity='.45'/><circle cx='200' cy='410' r='.9' opacity='.55'/><circle cx='270' cy='480' r='.6' opacity='.4'/><circle cx='350' cy='430' r='.8' opacity='.5'/><circle cx='420' cy='510' r='1' opacity='.55'/><circle cx='490' cy='460' r='.7' opacity='.45'/><circle cx='560' cy='540' r='.9' opacity='.5'/><circle cx='100' cy='560' r='.6' opacity='.4'/><circle cx='190' cy='540' r='.7' opacity='.45'/><circle cx='280' cy='570' r='1' opacity='.55'/><circle cx='370' cy='550' r='.6' opacity='.4'/></g></svg>");
  background-size:600px 600px;background-repeat:repeat;opacity:.7;
}
body.light::before{display:none}

/* Atmospheric glow (dark only) */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(circle at 12% 20%, rgba(212,175,55,.06) 0%, transparent 30%),
    radial-gradient(circle at 88% 80%, rgba(91,108,255,.07) 0%, transparent 40%);
}
body.light::after{display:none}

/* === HEADER === */
header{
  position:sticky;top:0;z-index:100;
  background:var(--header-bg);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  height:60px;
}
.header-inner{
  max-width:780px;width:100%;margin:0 auto;padding:0 18px;height:60px;
  display:flex;align-items:center;gap:12px;
}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;flex-shrink:0}
header.in-page .logo{display:none}
.logo-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-deep) 100%);
  color:var(--on-gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:20px;
  box-shadow:var(--shadow-gold);line-height:1;flex-shrink:0;
}
.logo-mark span{margin-top:-2px}
.logo-text-wrap{display:flex;flex-direction:column;line-height:1}
.logo-text{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:600;color:var(--text);letter-spacing:.01em;line-height:1}
.logo-sub{font-size:10px;color:var(--text-mute);letter-spacing:.18em;margin-top:4px;font-weight:500;text-transform:uppercase;font-family:'Lora',Georgia,serif}

.back-btn{
  display:none;align-items:center;gap:7px;
  background:transparent;border:0;color:var(--gold);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;font-weight:600;
  padding:8px 0;cursor:pointer;letter-spacing:.005em;
}
.back-btn .arrow{font-size:20px;line-height:1;font-family:Georgia,serif}
.back-btn:hover{color:var(--gold-bright)}
.back-btn.visible{display:inline-flex}

.header-actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-btn{
  background:transparent;border:0;color:var(--text-dim);
  width:38px;height:38px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;flex-shrink:0;
}
.icon-btn:hover,.icon-btn:active{background:var(--surface-hi);color:var(--gold)}
.icon-btn.active{color:var(--gold)}
.icon-btn svg{width:18px;height:18px}

/* === POPOVER === */
.popover{
  position:fixed;top:68px;right:14px;
  background:var(--pop-bg);
  border:1px solid var(--gold-line);border-radius:14px;
  padding:14px;box-shadow:var(--shadow-md);z-index:200;
  display:none;flex-direction:column;gap:6px;min-width:252px;
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
}
.popover.show{display:flex;animation:popIn .14s ease}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.popover-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 4px}
.popover-label{font-size:13px;color:var(--text-dim);font-weight:500;font-family:'Lora',Georgia,serif}

.fs-stepper{display:inline-flex;align-items:stretch;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;overflow:hidden;height:32px}
.fs-btn{background:transparent;border:0;color:var(--text);width:34px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;transition:color .12s,background .12s}
.fs-btn:hover,.fs-btn:active{color:var(--gold);background:var(--surface-hi)}
.fs-display{font-size:13px;color:var(--text);min-width:32px;text-align:center;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-weight:600;font-family:'Cormorant Garamond',Georgia,serif}

.ar-toggle{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);width:46px;height:32px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s}
.ar-toggle svg{width:16px;height:16px}
.ar-toggle:hover{color:var(--gold);border-color:var(--gold-line)}
.ar-toggle.on{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line)}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--surface-elev);color:var(--text);font-size:13px;font-weight:500;padding:11px 22px;border-radius:24px;box-shadow:var(--shadow-md);z-index:300;opacity:0;transition:opacity .18s;pointer-events:none;border:1px solid var(--gold-line);font-family:'Lora',Georgia,serif}
.toast.show{opacity:1}

/* === HERO (home page) === */
.hero{max-width:780px;margin:0 auto;padding:42px 18px 14px;text-align:center;position:relative}
.hero-orn{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 auto;color:var(--gold-line)}
.hero-orn::before,.hero-orn::after{content:'';flex:0 1 90px;height:1px;background:linear-gradient(to right,transparent,var(--gold-line) 50%,transparent)}
.hero-orn-mark{width:18px;height:18px;color:var(--gold);flex-shrink:0;opacity:.85}
.hero-bismillah{font-family:'Scheherazade New',serif;font-size:34px;color:var(--gold);direction:rtl;line-height:1.5;margin:18px auto 14px;font-weight:600;letter-spacing:.005em}
.hero-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:46px;font-weight:600;color:var(--text);line-height:1.05;letter-spacing:-.005em;margin-top:6px}
.hero-sub{font-family:'Lora',Georgia,serif;font-size:13.5px;color:var(--text-dim);margin-top:10px;letter-spacing:.06em;font-style:italic}

/* === SEARCH === */
.home-search{position:relative;max-width:580px;margin:28px auto 0;padding:0 18px}
.home-search .search-input{
  width:100%;height:52px;
  font-family:'Lora',Georgia,serif;font-size:15px;
  padding:0 18px 0 50px;
  background:var(--surface);border:1px solid var(--border-hi);
  border-radius:14px;color:var(--text);outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
  font-style:italic;
}
.home-search .search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);font-style:normal}
.home-search .search-input::placeholder{color:var(--text-mute);font-style:italic}
.home-search .search-icon{position:absolute;left:36px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold);pointer-events:none}

/* === SECTION HEAD === */
.section-head{
  max-width:780px;margin:36px auto 18px;padding:0 22px;
  display:flex;align-items:center;justify-content:center;gap:16px;
  color:var(--gold-line);
}
.section-head::before,.section-head::after{
  content:'';flex:1;max-width:140px;height:1px;
  background:linear-gradient(to right,transparent,var(--gold-line));
}
.section-head::after{background:linear-gradient(to left,transparent,var(--gold-line))}
.section-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.section-count{font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;font-weight:500;color:var(--text-mute);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* === SURA GRID === */
.sura-grid-wrap{max-width:780px;margin:0 auto;padding:0 18px 64px}
.sura-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.sura-card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 14px 16px;
  text-decoration:none;color:inherit;
  cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:9px;
  transition:transform .25s cubic-bezier(.4,0,.2,1),background .25s,border-color .25s,box-shadow .25s;
  overflow:hidden;font-family:inherit;
}
.sura-card.hidden{display:none}
.sura-card::before{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,transparent 30%,var(--gold-line) 50%,transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .25s;pointer-events:none;
}
.sura-card:hover,.sura-card:active{background:var(--surface-hi);border-color:var(--gold-line);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.sura-card:hover::before{opacity:1}
.card-num{font-family:'Cormorant Garamond',Georgia,serif;font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.card-ar{font-family:'Scheherazade New',serif;font-size:32px;color:var(--text);direction:rtl;line-height:1;font-weight:600;margin:2px 0;letter-spacing:.005em;text-align:center}
.card-divider{width:36px;height:1px;background:var(--gold-line)}
.card-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:600;color:var(--text);text-align:center;line-height:1.2;letter-spacing:.005em}
.card-meta{font-size:10px;color:var(--text-mute);letter-spacing:.16em;text-transform:uppercase;font-family:'Lora',Georgia,serif;font-weight:500;text-align:center}
body.hide-ar .card-ar{display:none}
body.hide-ar .card-name{font-size:20px;margin-top:6px}

@media(min-width:560px){.sura-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:840px){.sura-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}

/* === SURA PAGE === */
#suraPage{display:none;max-width:780px;margin:0 auto;padding:26px 18px 140px;opacity:0;transition:opacity .25s ease}
#suraPage.visible{display:block;opacity:1}

.sura-pg-header{text-align:center;padding-bottom:6px;margin-bottom:22px;position:relative}
.sura-pg-ornament{
  margin:0 auto 14px;display:flex;align-items:center;justify-content:center;gap:14px;
  color:var(--gold-line);max-width:300px;height:18px;
}
.sura-pg-ornament::before,.sura-pg-ornament::after{
  content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,var(--gold-line));
}
.sura-pg-ornament::after{background:linear-gradient(to left,transparent,var(--gold-line))}
.sura-pg-ornament-mark{width:18px;height:18px;color:var(--gold);flex-shrink:0}
.sura-pg-title-ar{font-family:'Scheherazade New',serif;font-size:52px;color:var(--text);direction:rtl;line-height:1.3;margin-bottom:10px;font-weight:600;letter-spacing:.005em}
.sura-pg-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:600;color:var(--gold);margin-bottom:2px;letter-spacing:.005em}
.sura-pg-tr{font-family:'Lora',Georgia,serif;font-size:12.5px;font-style:italic;color:var(--text-mute);letter-spacing:.14em;text-transform:lowercase;margin-bottom:6px}
.sura-pg-meta{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:18px}
.meta-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.meta-pill{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:12px;font-weight:600;
  color:var(--gold);letter-spacing:.18em;text-transform:uppercase;
  background:var(--gold-soft);border:1px solid var(--gold-line);
  border-radius:999px;padding:5px 14px;
}
.meta-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

.sura-pg-desc{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:18px 22px 18px 24px;margin:14px auto 0;max-width:640px;
  font-family:'Lora',Georgia,serif;font-size:14.5px;line-height:1.85;
  color:var(--text-dim);display:none;white-space:pre-line;text-align:left;position:relative;
}
.sura-pg-desc::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:2px;background:linear-gradient(to bottom,var(--gold),transparent);border-radius:2px}
.sura-pg-desc.show{display:block;animation:popIn .2s ease}

.desc-toggle,.btn-pill{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:13px;font-weight:600;letter-spacing:.08em;
  background:var(--surface);border:1px solid var(--border-hi);
  color:var(--text-dim);
  padding:7px 16px;border-radius:999px;cursor:pointer;
  transition:all .15s;
  display:inline-flex;align-items:center;gap:6px;
}
.desc-toggle:hover,.desc-toggle:active,.btn-pill:hover{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}

.jump-verse{display:inline-flex;align-items:stretch;background:var(--surface);border:1px solid var(--border-hi);border-radius:999px;overflow:hidden;height:36px}
.jump-verse input{background:transparent;border:0;color:var(--text);font-family:'Lora',Georgia,serif;font-size:13.5px;font-style:italic;padding:0 16px;width:148px;outline:none;-moz-appearance:textfield}
.jump-verse input::-webkit-outer-spin-button,.jump-verse input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.jump-verse input::placeholder{color:var(--text-mute)}
.jump-verse button{background:var(--gold-soft);border:0;color:var(--gold);font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;padding:0 16px;cursor:pointer;transition:all .12s;font-weight:600}
.jump-verse button:hover,.jump-verse button:active{background:var(--gold);color:var(--on-gold)}

/* === BISMILLAH FRAME === */
.bismillah-frame{text-align:center;margin:8px auto 30px;max-width:640px;padding:6px 0;position:relative}
.bismillah-frame .orn{display:flex;align-items:center;justify-content:center;gap:18px;color:var(--gold-line);height:20px}
.bismillah-frame .orn::before,.bismillah-frame .orn::after{content:'';flex:1;max-width:160px;height:1px;background:linear-gradient(to right,transparent,var(--gold-line) 50%,transparent)}
.bismillah-frame .orn-mid{width:20px;height:20px;color:var(--gold);flex-shrink:0}
.bismillah-text{font-family:'Scheherazade New',serif;font-size:42px;line-height:1.5;color:var(--gold);direction:rtl;padding:16px 0;font-weight:600;letter-spacing:.005em}

/* === VERSE CARDS === */
.verse{
  position:relative;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;
  padding:20px 22px 16px;margin-bottom:14px;
  transition:border-color .25s,background .25s;
}
.verse:hover{border-color:var(--gold-line)}
.verse.highlighted{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft) 0%,var(--surface) 50%)}
.verse.flash{border-color:var(--gold);background:var(--gold-soft);transition:border-color 1.6s,background 1.6s}

.verse-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.verse-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:36px;height:36px;padding:0 12px;
  border-radius:999px;border:1px solid var(--gold-line);
  color:var(--gold);background:var(--gold-soft);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;font-weight:700;letter-spacing:.005em;
  cursor:pointer;transition:all .15s;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.verse-num:hover,.verse-num:active{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.verse-head-line{flex:1;height:1px;background:linear-gradient(to right,var(--gold-line),transparent);align-self:center}

.verse-ar{
  font-family:'Scheherazade New',serif;direction:rtl;text-align:right;
  font-size:26px;line-height:2;color:var(--text);
  margin-bottom:14px;padding-bottom:18px;font-weight:500;letter-spacing:.005em;position:relative;
}
.verse-ar::after{content:'';display:block;position:absolute;left:30%;right:30%;bottom:0;height:1px;background:linear-gradient(to right,transparent,var(--gold-line) 30%,var(--gold-line) 70%,transparent)}

.verse-text{font-family:'Lora',Georgia,serif;font-size:15px;line-height:1.85;color:var(--text);font-weight:400}
.verse-text mark{background:var(--gold-soft);color:var(--text);border-radius:3px;padding:1px 4px;font-weight:500;border-bottom:1px solid var(--gold-line)}

.verse-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--divider)}
.verse-action{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--border-hi);color:var(--text-dim);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:12.5px;font-weight:600;letter-spacing:.08em;
  padding:6px 12px;border-radius:999px;cursor:pointer;transition:all .15s;
}
.verse-action:hover,.verse-action:active{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}
.verse-action svg{width:13px;height:13px}

.verse-izoh{
  margin-top:14px;padding:14px 18px;
  background:var(--bg-2);border:1px solid var(--border);
  border-left:3px solid var(--gold);border-radius:0 10px 10px 0;
  font-family:'Lora',Georgia,serif;font-size:13.5px;line-height:1.8;
  color:var(--text-dim);font-style:italic;display:none;
}
.verse-izoh.show{display:block;animation:popIn .18s ease}

body.hide-ar .verse-ar,body.hide-ar .sura-pg-title-ar{display:none}
body.hide-ar .verse-head{margin-bottom:6px}

/* === SEARCH RESULTS === */
.verse-hits{max-width:780px;margin:24px auto 0;padding:0 18px}
.verse-hits:empty{display:none}
.hits-more{text-align:center;color:var(--text-mute);font-family:'Lora',Georgia,serif;font-style:italic;font-size:13px;padding:14px}
.no-results{text-align:center;padding:36px 14px;color:var(--text-mute);font-size:14px;font-style:italic;font-family:'Lora',Georgia,serif}
.results-head{font-family:'Cormorant Garamond',Georgia,serif;font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.18em;margin:14px 0 10px;padding:0 4px}
.result-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.result-item:hover,.result-item:active{background:var(--surface-hi);border-color:var(--gold-line)}
.result-label{font-family:'Cormorant Garamond',Georgia,serif;font-size:12.5px;color:var(--gold);margin-bottom:6px;font-weight:600;letter-spacing:.08em}
.result-text{font-family:'Lora',Georgia,serif;font-size:14px;line-height:1.75;color:var(--text-dim)}
.result-text mark{background:var(--gold-soft);color:var(--text);border-radius:3px;padding:1px 4px;font-weight:500}
.result-text-ar{font-family:'Scheherazade New',serif;text-align:right;font-size:20px;line-height:1.9;color:var(--text);margin-bottom:6px;direction:rtl;font-weight:500}

/* === FLOATING NAV === */
.float-bar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--pop-bg);border:1px solid var(--gold-line);
  border-radius:32px;display:none;align-items:center;z-index:55;
  box-shadow:var(--shadow-md);overflow:hidden;
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
}
.float-bar.visible{display:flex}
.float-bar-btn{background:transparent;border:0;color:var(--gold);width:54px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:all .12s}
.float-bar-btn:hover,.float-bar-btn:active{background:var(--gold-soft)}
.float-bar-btn:disabled{color:var(--text-mute);opacity:.4;cursor:default}
.float-bar-btn:not(:last-child){border-right:1px solid var(--gold-line)}
.float-bar-btn svg{width:18px;height:18px}

.scroll-top{position:fixed;bottom:84px;right:22px;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--gold-line);display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);z-index:54;box-shadow:var(--shadow-card);padding:0;transition:all .15s}
.scroll-top:hover,.scroll-top:active{background:var(--gold-soft)}
.scroll-top.visible{display:flex}
.scroll-top svg{width:14px;height:14px}

/* === SHARE MODAL === */
.share-modal{
  position:fixed;inset:0;z-index:400;display:none;
  background:rgba(4,7,18,.78);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  align-items:center;justify-content:center;padding:18px;
}
.share-modal.show{display:flex;animation:popIn .2s ease}
.share-modal-inner{
  width:100%;max-width:480px;background:var(--surface);
  border:1px solid var(--gold-line);border-radius:18px;
  padding:18px;display:flex;flex-direction:column;gap:14px;
  box-shadow:var(--shadow-md);position:relative;
}
.share-header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.share-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:600;color:var(--gold);letter-spacing:.04em}
.share-close{background:transparent;border:0;color:var(--text-dim);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.share-close:hover{background:var(--surface-hi);color:var(--gold)}
.share-close svg{width:16px;height:16px}
.share-preview{position:relative;width:100%;aspect-ratio:1/1;background:var(--bg-deep);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.share-preview canvas{max-width:100%;max-height:100%;display:block}
.share-preview.loading::after{content:'Тайёрланмоқда...';color:var(--gold);font-family:'Lora',Georgia,serif;font-style:italic;position:absolute}
.share-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn-primary,.btn-secondary{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:13.5px;font-weight:600;letter-spacing:.1em;
  padding:9px 18px;border-radius:999px;cursor:pointer;
  transition:all .15s;border:1px solid;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn-primary:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
.btn-secondary{background:transparent;border-color:var(--border-hi);color:var(--text-dim)}
.btn-secondary:hover{color:var(--gold);border-color:var(--gold-line)}
.btn-primary svg,.btn-secondary svg{width:14px;height:14px}

/* === RESPONSIVE === */
@media(max-width:480px){
  header,.header-inner{height:58px}

  .verse{padding:18px 16px 14px}
  .verse-ar{font-size:23px;line-height:1.95}
  #suraPage{padding:22px 14px 130px}
}

/* === SHARE IMAGE (PNG) === */
function wrapTextCanvas(ctx,text,maxWidth){
  var words=String(text).split(/\s+/),lines=[],line='';
  for(var i=0;i<words.length;i++){
    var test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=words[i];}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}
function isLight(){return document.body.classList.contains('light');}
function renderShareCanvas(sura,verse){
  var W=1080,H=1080;
  var c=document.createElement('canvas');c.width=W;c.height=H;
  var ctx=c.getContext('2d');
  var light=isLight();
  /* Background */
  if(light){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#fcf7e9');g.addColorStop(1,'#ede2c3');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }else{
    var g2=ctx.createRadialGradient(W/2,H*0.35,80,W/2,H/2,W*0.85);
    g2.addColorStop(0,'#131a3f');g2.addColorStop(.6,'#0a1028');g2.addColorStop(1,'#040712');
    ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  }
  /* Stars (dark) */
  if(!light){
    var seed=1;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
    ctx.fillStyle='#d4af37';
    for(var i=0;i<70;i++){
      var sx=rnd()*W,sy=rnd()*H,sr=rnd()*1.6+.4;
      ctx.globalAlpha=rnd()*.5+.15;
      ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  var gold=light?'#9a7212':'#d4af37';
  var goldDim=light?'rgba(154,114,18,.4)':'rgba(212,175,55,.45)';
  var goldFaint=light?'rgba(154,114,18,.25)':'rgba(212,175,55,.3)';
  var textCol=light?'#1a1f3d':'#ece5d0';
  var subCol=light?'#5b6485':'#a4adcc';
  /* Border frame */
  ctx.strokeStyle=goldDim;ctx.lineWidth=1.5;
  ctx.strokeRect(48,48,W-96,H-96);
  ctx.strokeStyle=goldFaint;ctx.lineWidth=1;
  ctx.strokeRect(64,64,W-128,H-128);
  /* Top ornament line + star */
  function drawStar(cx,cy,size){
    ctx.fillStyle=gold;ctx.beginPath();
    ctx.moveTo(cx,cy-size);ctx.lineTo(cx+size*.25,cy-size*.25);
    ctx.lineTo(cx+size,cy);ctx.lineTo(cx+size*.25,cy+size*.25);
    ctx.lineTo(cx,cy+size);ctx.lineTo(cx-size*.25,cy+size*.25);
    ctx.lineTo(cx-size,cy);ctx.lineTo(cx-size*.25,cy-size*.25);
    ctx.closePath();ctx.fill();
  }
  drawStar(W/2,118,12);
  /* Sura title */
  ctx.fillStyle=gold;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='600 38px "Cormorant Garamond", Georgia, serif';
  ctx.fillText((sura.name+' сураси').toUpperCase(),W/2,184);
  ctx.fillStyle=subCol;
  ctx.font='italic 400 22px Lora, Georgia, serif';
  ctx.fillText(verse.label+'-оят',W/2,222);
  /* Divider under title */
  ctx.strokeStyle=goldDim;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W*0.28,260);ctx.lineTo(W*0.72,260);ctx.stroke();
  var yCursor=320;
  /* Arabic */
  if(verse.ar){
    ctx.fillStyle=textCol;
    ctx.font='600 56px "Scheherazade New", "Amiri", serif';
    ctx.textAlign='center';
    if(ctx.direction!==undefined)ctx.direction='rtl';
    var arLines=wrapTextCanvas(ctx,verse.ar,W-220);
    if(arLines.length>5){arLines=arLines.slice(0,5);arLines[4]=arLines[4]+' …';}
    var arLh=88;
    for(var i=0;i<arLines.length;i++){
      ctx.fillText(arLines[i],W/2,yCursor);yCursor+=arLh;
    }
    if(ctx.direction!==undefined)ctx.direction='ltr';
    yCursor+=14;
    ctx.strokeStyle=goldDim;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(W*0.34,yCursor);ctx.lineTo(W*0.66,yCursor);ctx.stroke();
    yCursor+=46;
  }else{
    yCursor=380;
  }
  /* Uzbek translation */
  var uzText=verse.text;var iz=uzText.indexOf('Изоҳ:');if(iz>=0)uzText=uzText.substring(0,iz).trim();
  ctx.fillStyle=textCol;ctx.font='500 30px Lora, Georgia, serif';ctx.textAlign='center';
  var uzLines=wrapTextCanvas(ctx,uzText,W-220);
  var uzLh=44;
  var maxLines=Math.floor((H-160-yCursor)/uzLh);
  if(uzLines.length>maxLines){
    uzLines=uzLines.slice(0,maxLines);
    uzLines[uzLines.length-1]=uzLines[uzLines.length-1].replace(/\s+\S+$/,' …');
  }
  for(var i=0;i<uzLines.length;i++){
    ctx.fillText(uzLines[i],W/2,yCursor);yCursor+=uzLh;
  }
  /* Footer ornament + watermark */
  drawStar(W/2,H-128,10);
  ctx.strokeStyle=goldDim;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W*0.34,H-104);ctx.lineTo(W*0.66,H-104);ctx.stroke();
  ctx.fillStyle=gold;ctx.textAlign='center';
  ctx.font='600 22px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('Қуръон',W/2,H-72);
  ctx.fillStyle=subCol;
  ctx.font='italic 400 16px Lora, Georgia, serif';
  ctx.fillText('abuyahyo.github.io/quron',W/2,H-44);
  return c;
}
