// Build a regex from a (partly) voweled Arabic query: each consonant must
// appear in order; where the user typed a short vowel, that exact vowel is
// required on that consonant; consonants left bare match regardless of vowel.
// Matched against the strict (vowel-preserving) verse key _als.
function arRe(q){
  var st=normArStrict(q),H='[\u064B-\u0652\u0670]',pat='';
  for(var k=0;k<st.length;k++){
    var c=st.charCodeAt(k);
    if((c>=0x64B&&c<=0x652)||c===0x670)continue;// stray mark, skip
    var reqs='',m=k+1;
    while(m<st.length){var d=st.charCodeAt(m);if((d>=0x64B&&d<=0x652)||d===0x670){if(d>=0x64B&&d<=0x650)reqs+='(?='+H+'*'+st.charAt(m)+')';m++;}else break;}
    pat+=st.charAt(k)+reqs+H+'*';
    k=m-1;
  }
  if(!pat)return null;
  try{return new RegExp(pat);}catch(e){return null;}
}

function wrapText(ctx,text,maxW){
  var lines=[];
  var paragraphs=text.split(/\n\n+/);
  for(var p=0;p<paragraphs.length;p++){
    var words=paragraphs[p].replace(/\n/g,' ').split(/\s+/);
    var line='';
    for(var w=0;w<words.length;w++){
      var test=line?line+' '+words[w]:words[w];
      if(ctx.measureText(test).width>maxW&&line){
        lines.push(line);
        line=words[w];
      }else{
        line=test;
      }
    }
    if(line)lines.push(line);
    if(p<paragraphs.length-1)lines.push('');
  }
  return lines;
}

function drawRoundedRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
  if(fill)ctx.fill();
  if(stroke)ctx.stroke();
}
function drawDescBg(ctx,W,H,light){

  else{grad.addColorStop(0,'#0f5247');grad.addColorStop(0.5,'#0a3a30');grad.addColorStop(1,'#04221b');}
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  var rg=ctx.createRadialGradient(W*0.85,H*0.1,0,W*0.85,H*0.1,W*0.9);
  rg.addColorStop(0,light?'rgba(16,185,129,0.07)':'rgba(16,185,129,0.20)');rg.addColorStop(1,'rgba(16,185,129,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  if(!light){
    var rg2=ctx.createRadialGradient(W*0.1,H*0.95,0,W*0.1,H*0.95,W*0.7);

  }
}

function drawDescPages(sura){
  var W=1080,H=1350,mx=80;
  var fontSize=42,lineHeight=Math.round(fontSize*1.55);
  var maxW=W-2*mx;
  var mCv=document.createElement('canvas');
  mCv.width=W;mCv.height=H;
  var mCtx=mCv.getContext('2d');
  mCtx.font='500 '+fontSize+'px '+SANS;
  var paragraphs=sura.description.split(/\n\n+/).map(function(t){
    return wrapText(mCtx,t.replace(/\n/g,' '),maxW);
  }).filter(function(p){return p.length>0;});
  var p1BodyTop=480,p1BodyBottom=H-130,pnBodyTop=240,pnBodyBottom=H-130;
  var p1Avail=Math.floor((p1BodyBottom-p1BodyTop)/lineHeight);
  var pnAvail=Math.floor((pnBodyBottom-pnBodyTop)/lineHeight);
  var WIDOW=3;
  var pages=[],cur=[],capacity=p1Avail;
  function pushPage(){
    while(cur.length&&cur[cur.length-1]==='')cur.pop();
    if(cur.length)pages.push(cur);
    cur=[];capacity=pnAvail;
  }
  for(var i=0;i<paragraphs.length;i++){
    var para=paragraphs[i];
    var gap=cur.length>0?1:0;
    if(para.length+gap<=capacity){
      if(gap)cur.push('');
      for(var k=0;k<para.length;k++)cur.push(para[k]);
      capacity-=para.length+gap;
      continue;
    }
    var pageAvail=pages.length===0?p1Avail:pnAvail;
    var used=pageAvail-capacity;
    var underfilled=used*2<pageAvail;
    if(para.length<=pnAvail&&!underfilled){
      pushPage();
      for(var k=0;k<para.length;k++)cur.push(para[k]);
      capacity-=para.length;
      continue;
    }
    var rem=para.slice();
    var first=true;
    while(rem.length>0){
      var g=(first&&cur.length>0)?1:0;
      var avail=capacity-g;
      if(avail<WIDOW){pushPage();g=0;avail=capacity;}
      var take;
      var leftover=rem.length-avail;
      if(leftover<=0){take=rem.length;}
      else if(leftover<WIDOW){take=Math.max(WIDOW,rem.length-WIDOW);if(take>avail)take=avail;}
      else{take=avail;}
      if(g)cur.push('');
      for(var k=0;k<take;k++)cur.push(rem[k]);
      capacity-=take+g;
      rem=rem.slice(take);
      first=false;
      if(rem.length>0)pushPage();
    }
  }
  pushPage();
  if(!pages.length)pages.push([]);
  var light=th==='light';
  var txtColor=light?'#0f1a14':'#ffffff';
  var canvases=[];
  var urlText='abuyahyo.github.io/quron#/'+sura.number;
  var totalPages=pages.length;
  for(var p=0;p<totalPages;p++){
    var cv=document.createElement('canvas');
    cv.width=W;cv.height=H;
    var ctx=cv.getContext('2d');
    drawDescBg(ctx,W,H,light);
    var bodyTop,bodyBottom;
    if(p===0){
      var stype=SURA_TYPE_ARR[sura.number-1]==='M'?'МАККА':'МАДИНА';
      drawPill(ctx,'СУРА '+sura.number+' · '+stype+' · '+sura.verseCount+' ОЯТ',mx,130,light);
      ctx.fillStyle=txtColor;
      ctx.font='800 90px '+SANS;
      ctx.textBaseline='alphabetic';ctx.textAlign='left';
      ctx.fillText(sura.name+' сураси',mx,360);
      bodyTop=p1BodyTop;bodyBottom=p1BodyBottom;
    }else{
      drawPill(ctx,sura.name+' сураси',mx,130,light);
      bodyTop=pnBodyTop;bodyBottom=pnBodyBottom;
    }
    var pageLines=pages[p];
    ctx.fillStyle=txtColor;
    ctx.font='500 '+fontSize+'px '+SANS;
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    var y;
    if(p===totalPages-1&&totalPages>1){
      var contentH=pageLines.length*lineHeight;
      var slack=(bodyBottom-bodyTop)-contentH;
      y=bodyTop+Math.max(0,Math.floor(slack/2))+fontSize;
    }else{
      y=bodyTop+fontSize;
    }
    for(var li=0;li<pageLines.length;li++){
      if(pageLines[li])ctx.fillText(pageLines[li],mx,y);
      y+=lineHeight;
    }
    drawFooter(ctx,p+1,totalPages,W,H,mx,urlText,light);
    canvases.push(cv);
  }
  return canvases;
}

function refNorm(s){return (s||'').toLowerCase().replace(/[^Ѐ-ӿ]/g,'').replace(/\u049B/g,'\u043A').replace(/\u0493/g,'\u0433').replace(/\u04B3/g,'\u0445').replace(/\u045E/g,'\u0443').replace(/[\u044A\u044C]/g,'');}
// edit distance <= 1 (one substitution/insertion/deletion), for forgiving
// sura-name matching (e.g. \u043d\u0438\u0441\u0430 vs \u043d\u0438\u0441\u043e).
function ed1(a,b){var la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;if(a===b)return true;var i=0,j=0,d=0;while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;}else{if(++d>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}}}if(i<la||j<lb)d++;return d<=1;}
function parseSeg(seg,bestOnly){
  seg=(seg||'').toLowerCase().trim();
  if(seg.length<2||!/[0-9]/.test(seg))return [];
  var nums=seg.match(/[0-9]+/g);
  if(!nums)return [];
  var name=seg.replace(/сураси|сура|оятларни|оятлар|оятни|ояти|оят|аят/g,' ');
  var key=refNorm(name);
  if(key.length<2)return [];
  var suras=[];
  for(var i=0;i<QD.length;i++){
    var s=QD[i],snl=refNorm(s.name);
    if(snl.indexOf(key)<0)continue;
    suras.push({s:s,rank:snl===key?0:(snl.indexOf(key)===0?1:2)});
  }
  if(!suras.length){for(var i=0;i<QD.length;i++){var s=QD[i],snl=refNorm(s.name);if(ed1(snl,key))suras.push({s:s,rank:3});}}
  if(!suras.length)return [];
  suras.sort(function(a,b){return a.rank-b.rank||a.s.number-b.s.number;});
  var out=[];
  for(var k=0;k<nums.length;k++){
    var vnum=parseInt(nums[k],10);
    if(!vnum||vnum>286)continue;
    var pool=bestOnly?[suras[0]]:suras;
    for(var p=0;p<pool.length;p++){
      var sr=pool[p].s;
      if(vnum>sr.verseCount)continue;
      var v=null;
      for(var j=0;j<sr.verses.length;j++){if(sr.verses[j].nums.indexOf(vnum)>=0){v=sr.verses[j];break;}}
      if(!v)continue;
      out.push({s:sr,v:v,vnum:vnum,rank:pool[p].rank});
    }
  }
  return out;
}
function parseRef(raw){
  var q=(raw||'').toLowerCase().trim();
  if(q.length<2||!/[0-9]/.test(q))return null;
  var segs=q.replace(/(оят|аят)/g,'$1\u0001').split(/[*;\n\u2022\t\u0001]+/);
  var clean=[];for(var i=0;i<segs.length;i++){var t=segs[i].replace(/^[\s,.-]+|[\s,.-]+$/g,'');if(t.length)clean.push(t);}
  var multiSeg=clean.length>1;
  var all=[];
  for(var i=0;i<clean.length;i++){
    var nc=(clean[i].match(/[0-9]+/g)||[]).length;
    var hs=parseSeg(clean[i],multiSeg||nc>1);
    for(var k=0;k<hs.length;k++)all.push(hs[k]);
  }
  if(!all.length)return null;
  var seen={},uniq=[];
  for(var i=0;i<all.length;i++){var ky=all[i].s.number+'|'+all[i].v.label;if(seen[ky])continue;seen[ky]=1;uniq.push(all[i]);}
  return {hits:uniq,multi:uniq.length>1};
}

    h+='</a>';

  box.innerHTML=h;
