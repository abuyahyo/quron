<style>
:root{
  --bg:#0c1410;--bg-sub:#0f1814;--surface:#152018;--surface-hi:#1d2a22;--surface-elev:#22332a;
  --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.14);--divider:rgba(255,255,255,0.06);
  --text:#e8efeb;--text-dim:#a8b4ad;--text-muted:#6e7c76;
  --emerald:#10b981;--emerald-bright:#34d399;--emerald-dim:#059669;--emerald-soft:rgba(16,185,129,0.13);
  --gold:#d4a843;--gold-dim:#a37f30;--gold-soft:rgba(212,168,67,0.13);
  --header-bg:rgba(12,20,16,0.92);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 6px 18px rgba(0,0,0,0.35)
}
.light{
  --bg:#fafbf9;--bg-sub:#f1f4f1;--surface:#ffffff;--surface-hi:#f5f8f6;--surface-elev:#ebefed;
  --border:rgba(0,0,0,0.08);--border-strong:rgba(0,0,0,0.14);--divider:rgba(0,0,0,0.06);
  --text:#0f1a14;--text-dim:#4a5550;--text-muted:#7a857f;
  --emerald:#059669;--emerald-bright:#10b981;--emerald-dim:#047857;--emerald-soft:rgba(5,150,105,0.11);
  --gold:#a37f30;--gold-dim:#7a5e1a;--gold-soft:rgba(163,127,48,0.11);
  --header-bg:rgba(250,251,249,0.92);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 6px 18px rgba(0,0,0,0.07)
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--emerald-dim) transparent}
html::-webkit-scrollbar{width:8px;height:8px}
html::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb{background:var(--emerald-dim);border-radius:8px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;transition:background .2s,color .2s;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);height:56px}
.header-inner{max-width:720px;width:100%;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
header.in-page .logo{display:none}
body.in-sura header{display:none}
body.in-sura .reading-progress{top:0}
.logo-text{font-size:15.5px;font-weight:600;color:var(--text);line-height:1.1;letter-spacing:-.01em}
.logo-sub{font-size:11px;color:var(--text-muted);letter-spacing:.04em;margin-top:2px;font-weight:500}

.back-btn{display:none;align-items:center;gap:4px;background:transparent;border:0;color:var(--emerald);font-family:inherit;font-size:15px;font-weight:500;padding:8px 0;cursor:pointer;letter-spacing:-.01em}
.back-btn .arrow{font-size:18px;line-height:1;font-family:Georgia,serif}
.back-btn:hover{color:var(--emerald-bright)}
.back-btn.visible{display:inline-flex}

.header-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.icon-btn{background:transparent;border:0;color:var(--text-dim);width:36px;height:36px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;flex-shrink:0}
.icon-btn:hover,.icon-btn:active{background:var(--surface-hi);color:var(--emerald)}
.icon-btn.active{color:var(--emerald)}
.icon-btn svg{width:18px;height:18px}

.popover{position:fixed;top:62px;right:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow-md);z-index:200;display:none;flex-direction:column;gap:8px;min-width:240px}
.popover.show{display:flex;animation:popIn .14s ease}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.popover.bottom{position:fixed;top:auto;bottom:80px;right:14px}
.popover-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 4px}
.popover-label{font-size:13px;color:var(--text-dim);font-weight:500}

.fs-stepper{display:inline-flex;align-items:stretch;background:var(--surface-elev);border-radius:9px;overflow:hidden;height:30px}
.fs-btn{background:transparent;border:0;color:var(--text);width:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:color .12s,background .12s}
.fs-btn:hover,.fs-btn:active{color:var(--emerald);background:var(--surface-hi)}
.fs-display{font-size:12.5px;color:var(--text);min-width:30px;text-align:center;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-weight:500}

.ar-toggle{background:var(--surface-elev);border:0;color:var(--text-dim);width:42px;height:30px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s}
.ar-toggle svg{width:16px;height:16px}
.ar-toggle:hover{color:var(--emerald)}
.ar-toggle.on{color:var(--emerald);background:var(--emerald-soft)}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:24px;box-shadow:var(--shadow-md);z-index:300;opacity:0;transition:opacity .18s;pointer-events:none;letter-spacing:-.01em}
.toast.show{opacity:1}

.sura-grid-wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}

.home-search{position:relative;padding:18px 0 14px}
.home-search .search-input{width:100%;height:46px;font-family:inherit;font-size:15px;padding:0 16px 0 44px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.home-search .search-input:focus{border-color:var(--emerald);box-shadow:0 0 0 3px var(--emerald-soft)}
.home-search .search-input::placeholder{color:var(--text-muted)}
.home-search .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-muted);pointer-events:none}

.daily-section{padding:0 0 4px}
.daily-section:empty{display:none}
.daily-verse{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--emerald);border-radius:12px;padding:14px 16px;margin-bottom:18px;transition:background .12s}
.daily-verse:hover,.daily-verse:active{background:var(--surface-hi)}
.daily-verse-label{font-size:11px;font-weight:600;color:var(--emerald);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;display:block}
.daily-verse-ar{font-family:'Scheherazade New','Amiri','Geeza Pro','Noto Naskh Arabic',serif;direction:rtl;font-size:21px;line-height:1.75;color:var(--text);margin-bottom:8px;font-weight:400}
.daily-verse-text{font-size:14px;line-height:1.7;color:var(--text-dim);margin-bottom:8px}
.daily-verse-meta{font-size:12px;color:var(--emerald);font-weight:500}
.daily-verse-meta .arr{display:none}
body.hide-ar .daily-verse-ar{display:none}

.grid-header{padding:0 4px 8px;display:flex;align-items:baseline;justify-content:space-between}
.grid-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em}
.grid-count{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}

.sura-grid{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sura-card{display:flex;align-items:center;gap:14px;padding:12px 14px;text-decoration:none;color:inherit;cursor:pointer;background:transparent;border:0;width:100%;font-family:inherit;text-align:left;border-bottom:1px solid var(--divider);transition:background .1s}
.sura-card:last-of-type{border-bottom:0}
.sura-card.hidden{display:none}
.sura-card:hover,.sura-card:active{background:var(--surface-hi)}
.card-num{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--emerald-soft);color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.card-name{font-size:15px;font-weight:500;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.card-meta{font-size:12px;color:var(--text-muted);line-height:1.3}
.card-ar{font-family:'Scheherazade New','Amiri','Geeza Pro','Noto Naskh Arabic',serif;direction:rtl;font-size:20px;color:var(--gold);flex-shrink:0;line-height:1;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.hide-ar .card-ar{display:none}
.card-chevron{flex-shrink:0;color:var(--text-muted);display:flex;align-items:center;justify-content:center;width:14px}
.card-chevron svg{width:14px;height:14px}

.reading-progress{position:fixed;top:56px;left:0;right:0;height:2px;z-index:99}
.reading-progress-bar{height:100%;background:var(--emerald);width:0%;transition:width .1s}

#suraPage{display:none;max-width:720px;margin:0 auto;padding:24px 16px 120px;opacity:0;transition:opacity .2s ease}
#suraPage.visible{display:block;opacity:1}

.sura-pg-header{text-align:center;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.sura-pg-title-ar{font-family:'Scheherazade New','Amiri','Geeza Pro','Noto Naskh Arabic',serif;font-size:34px;color:var(--gold);direction:rtl;line-height:1.3;margin-bottom:6px;font-weight:400}
.sura-pg-title{font-size:22px;font-weight:600;color:var(--text);margin-bottom:8px;letter-spacing:-.015em}
.sura-pg-meta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.meta-pill{font-size:12px;color:var(--text-muted);font-weight:500}

.sura-pg-bismillah{text-align:center;font-family:'Scheherazade New',serif;font-size:24px;color:var(--gold);padding:12px 0 22px;direction:rtl;line-height:1.7;font-weight:400}

.sura-pg-desc{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--emerald);border-radius:10px;padding:14px 18px;margin-top:14px;font-size:14px;line-height:1.7;color:var(--text-dim);display:none;white-space:pre-line;text-align:left}
.sura-pg-desc.show{display:block}

.desc-toggle{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-family:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .12s}
.desc-toggle:hover,.desc-toggle:active{color:var(--emerald);border-color:var(--emerald)}

.jump-verse{display:inline-flex;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;height:32px}
.jump-verse input{background:transparent;border:0;color:var(--text);font-family:inherit;font-size:13px;padding:0 14px;width:130px;outline:none;-moz-appearance:textfield}
.jump-verse input::-webkit-outer-spin-button,.jump-verse input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.jump-verse input::placeholder{color:var(--text-muted)}
.jump-verse button{background:var(--surface-elev);border:0;color:var(--emerald);font-family:inherit;font-size:14px;padding:0 14px;cursor:pointer;transition:background .12s}
.jump-verse button:hover,.jump-verse button:active{background:var(--emerald-soft)}

.verse{padding:18px 0;border-bottom:1px solid var(--divider);transition:background .2s}
.verse:last-of-type{border-bottom:0}
.verse::after{content:'';display:block;clear:both}
.verse.highlighted{background:var(--emerald-soft);margin:0 -14px;padding:18px 14px;border-radius:10px;border-bottom-color:transparent}
.verse.flash{background:var(--gold-soft)!important;transition:background 1.4s}

.verse-num{float:left;font-family:inherit;font-size:12px;font-weight:600;color:var(--emerald);min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--emerald);border-radius:999px;padding:0 9px;margin:2px 12px 0 0;background:var(--emerald-soft);cursor:pointer;transition:all .12s;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.verse-num:hover,.verse-num:active{background:var(--emerald);color:#fff}

.verse-ar{font-family:'Scheherazade New','Amiri','Geeza Pro','Noto Naskh Arabic',serif;direction:rtl;text-align:right;font-size:22px;line-height:1.95;color:var(--text);margin-bottom:12px;padding-bottom:12px;font-weight:400;border-bottom:1px solid var(--divider)}

.verse-text{font-family:inherit;font-size:15px;line-height:1.75;color:var(--text)}
.verse-text mark{background:var(--gold-soft);color:var(--text);border-radius:3px;padding:1px 4px;font-weight:500}

.verse-izoh{margin-top:10px;padding:11px 14px;background:var(--emerald-soft);border-left:3px solid var(--emerald);border-radius:0 8px 8px 0;font-size:13px;line-height:1.7;color:var(--text-dim);display:none}
.verse-izoh.show{display:block}

.izoh-toggle{font-family:inherit;font-size:12px;font-weight:500;color:var(--emerald);cursor:pointer;margin-top:10px;display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--emerald);border-radius:16px;padding:5px 12px;transition:background .12s}
.izoh-toggle:hover,.izoh-toggle:active{background:var(--emerald-soft)}

body.hide-ar .verse-ar,body.hide-ar .sura-pg-title-ar{display:none}

#searchPage{display:none;max-width:720px;margin:0 auto;padding:20px 16px 100px;opacity:0;transition:opacity .2s ease}
#searchPage.visible{display:block;opacity:1}
.search-pg-header{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.search-pg-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px;letter-spacing:-.01em}
.search-pg-meta{font-size:12px;color:var(--text-muted)}
.result-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:all .12s}
.result-item:hover,.result-item:active{background:var(--surface-hi);border-color:var(--emerald)}
.result-label{font-size:12px;color:var(--emerald);margin-bottom:5px;font-weight:600}
.result-text{font-size:14px;line-height:1.75;color:var(--text-dim)}
.result-text mark{background:var(--gold-soft);color:var(--text);border-radius:3px;padding:1px 4px;font-weight:500}
.result-text-ar{font-family:'Scheherazade New','Amiri','Geeza Pro','Noto Naskh Arabic',serif;text-align:right;font-size:18px;line-height:1.85;color:var(--text);margin-bottom:6px;direction:rtl;font-weight:400}
.no-results{text-align:center;padding:60px 14px;color:var(--text-muted);font-size:14px}
.section-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px;padding:0 4px}

.float-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:28px;display:none;align-items:center;z-index:55;box-shadow:var(--shadow-md);overflow:hidden}
.float-bar.visible{display:flex}
.float-bar-btn{background:transparent;border:0;color:var(--emerald);width:52px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .12s,color .12s}
.float-bar-btn:hover,.float-bar-btn:active{background:var(--surface-hi)}
.float-bar-btn:disabled{color:var(--text-muted);opacity:.4;cursor:default}
.float-bar-btn:not(:last-child){border-right:1px solid var(--divider)}
.float-bar-btn svg{width:18px;height:18px}

.float-theme,.float-settings{position:fixed;bottom:18px;width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--emerald);z-index:55;box-shadow:var(--shadow-md);padding:0;transition:all .12s}
.float-theme{left:14px}
.float-settings{right:14px}
.float-theme:hover,.float-theme:active,.float-settings:hover,.float-settings:active{background:var(--surface-hi)}
.float-theme.visible,.float-settings.visible{display:flex}
.float-theme svg,.float-settings svg{width:18px;height:18px}

.scroll-top{position:fixed;bottom:78px;right:21px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--emerald);z-index:54;box-shadow:var(--shadow-sm);padding:0;transition:background .12s}
.scroll-top:hover,.scroll-top:active{background:var(--surface-hi)}
.scroll-top.visible{display:flex}
.scroll-top svg{width:14px;height:14px}

.juz-marker{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--text-muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.juz-marker::before,.juz-marker::after{content:'';flex:1;height:1px;background:var(--border)}

.sura-footer{display:none}

@media(max-width:480px){
  header,.header-inner,.reading-progress{height:54px}
  .reading-progress{top:54px}
  .header-inner{padding:0 14px}
  .sura-grid-wrap{padding:0 14px 40px}
  .home-search{padding:14px 0 12px}
  .home-search .search-input{height:44px;font-size:14.5px}
  .daily-verse{padding:12px 14px;border-radius:11px}
  .daily-verse-ar{font-size:19px}
  .sura-card{padding:11px 13px;gap:12px}
  .card-num{width:32px;height:32px;font-size:12.5px}
  .card-name{font-size:14.5px}
  .card-ar{font-size:18px;max-width:120px}
  .sura-pg-title-ar{font-size:30px}
  .sura-pg-title{font-size:20px}
  .sura-pg-bismillah{font-size:22px}
  .verse-ar{font-size:21px}
}
</style>

<body>
<div class="reading-progress"><div class="reading-progress-bar" id="progressBar"></div></div>
<header role="banner">
  <div class="header-inner">
  <div class="logo" onclick="App.goHome()" role="button" tabindex="0" aria-label="Бош саҳифа">
    <div><div class="logo-text">Қуръон</div><div class="logo-sub">Ўзбекча таржима</div></div>
  </div>
  <button class="back-btn" id="backBtn" onclick="App.goHome()" aria-label="Бош саҳифа"><span class="arrow" aria-hidden="true">←</span><span>Орқага</span></button>

<script>
var App=(function(){
var _s={};
function sg(k,d){try{var v=localStorage.getItem(k);return v!==null?v:d;}catch(e){return _s[k]!==undefined?_s[k]:d;}}

function normAr(s){if(!s)return '';return s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[\u0622\u0623\u0625\u0671]/g,'\u0627').replace(/\u0649/g,'\u064A').replace(/\u0629/g,'\u0647');}

};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

}

function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.className='toast show';clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast';},1800);}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);return Promise.resolve();}catch(e){return Promise.reject(e);}}
function suraLink(n){return location.origin+location.pathname+'#/'+n;}

var SURA_TYPE=['M','M','M','M','M','M','M','M','D','M','M','M','M','M','M','M','M','M','M','M','M','D','M','D','M','M','M','M','M','M','M','M','D','M','M','M','M','M','M','D','M','D','M','D','M','M','D','D','D','M','M','M','M','M','D','M','D','D','D','D','D','D','D','D','D','D','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','D','M','M','M','M','M','M','M','M','M','D','M','D','M','D','D','M'];

var DAILY_AYAHS=[
  {n:1,a:2},{n:1,a:5},

];
function findVerseByAyah(suraN,ayahN){var s=gS(suraN);if(!s)return null;for(var i=0;i<s.verses.length;i++){if(s.verses[i].nums.indexOf(ayahN)>=0)return{sura:s,verse:s.verses[i]};}return null;}
function dailyIndex(){var d=new Date();var st=new Date(d.getFullYear(),0,0);var diff=d.getTime()-st.getTime();var doy=Math.floor(diff/86400000);var L=DAILY_AYAHS.length;return((doy%L)+L)%L;}
function getDailyVerse(){var L=DAILY_AYAHS.length;for(var i=0;i<L;i++){var idx=(dailyIndex()+i)%L;var hit=findVerseByAyah(DAILY_AYAHS[idx].n,DAILY_AYAHS[idx].a);if(hit)return hit;}return null;}
function renderDailySection(){var sec=document.getElementById('dailySection');if(!sec)return;var h='';var d=getDailyVerse();if(d){var dt=d.verse.text;var iz=dt.indexOf('Изоҳ:');if(iz>=0)dt=dt.substring(0,iz).trim();var dhref='#/'+d.sura.number+'/'+d.verse.label;h+='<a class="daily-verse" href="'+dhref+'" onclick="event.preventDefault();App.open('+d.sura.number+',\'\',\''+esc(d.verse.label)+'\')">';h+='<span class="daily-verse-label">Кун ояти</span>';if(d.verse.ar)h+='<div class="daily-verse-ar" dir="rtl" lang="ar">'+esc(d.verse.ar)+'</div>';h+='<div class="daily-verse-text">'+esc(dt)+'</div>';h+='<div class="daily-verse-meta">'+esc(d.sura.name)+' · '+esc(d.verse.label)+'-оят <span class="arr" aria-hidden="true">→</span></div>';h+='</a>';}sec.innerHTML=h;}

function buildGrid(q){
  q=(q||'').toLowerCase().trim();
  var g=document.getElementById('suraGrid'),h='';
  for(var i=0;i<QD.length;i++){
    var s=QD[i],qa=normAr(q),ok=!q||s._nl.indexOf(q)>=0||String(s.number).indexOf(q)>=0||(s.nameTr&&s.nameTr.toLowerCase().indexOf(q)>=0)||(qa&&s._anl&&s._anl.indexOf(qa)>=0);
    var stype=SURA_TYPE[s.number-1]==='M'?'makki':'madani';

    h+='<a class="sura-card'+(ok?'':' hidden')+'" data-num="'+s.number+'" data-type="'+stype+'" href="#/'+s.number+'" onclick="event.preventDefault();App.open('+s.number+')">';

function openSura(num,hw,scrollVerse){
  hw=hw||'';
  var sura=gS(num);
  if(!sura)return;
  curN=num;curHw=hw;
  showPanel('sura');
  function pV(t){
    var i=t.indexOf('Изоҳ:');
    return i<0?{m:t,iz:''}:{m:t.substring(0,i).trim(),iz:t.substring(i).trim()};
  }
  var vH='';
  for(var j=0;j<sura.verses.length;j++){
    var v=sura.verses[j];
    var p=pV(v.text);
    var hilit=(hw&&v.text.toLowerCase().indexOf(hw.toLowerCase())>=0)||(scrollVerse&&v.label===scrollVerse);
    var lbl=esc(v.label);
    vH+='<div class="verse'+(hilit?' highlighted':'')+'" id="v-'+lbl+'" data-lbl="'+lbl+'">';
    vH+='<button class="verse-num" type="button" onclick="App.cp('+num+',\''+lbl+'\')" aria-label="Нусха олиш" title="Нусха олиш">'+lbl+'</button>';
    if(v.ar)vH+='<div class="verse-ar" dir="rtl" lang="ar" style="font-size:'+arFz(fz)+'px">'+esc(v.ar)+'</div>';

  html+='<form class="jump-verse" onsubmit="App.jumpV(event)"><input id="jumpInput" type="number" min="1" max="'+sura.verseCount+'" placeholder="Оятга ўтиш" inputmode="numeric" aria-label="Оят рақами"><button type="submit" aria-label="Ўтиш">→</button></form>';

  html+='<div>'+vH+'</div>';

  if(scrollVerse){
    setTimeout(function(){var el=document.getElementById('v-'+scrollVerse);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});},80);
  }else{window.scrollTo(0,0);}

function doSearch(q){
  if(!q){goHome();return;}
  var h='';
  if(q.length<2){
    h='<div class="search-pg-header"><h2 class="search-pg-title">\u049a\u0438\u0434\u0438\u0440\u0438\u0448 \u0442\u0430\u0440\u0438\u0445\u0438</h2></div>';
    if(!sh.length){
      h+='<div class="no-results">\u0422\u0430\u0440\u0438\u0445 \u0439\u045e\u049b</div>';
    } else {
      for(var i=0;i<sh.length;i++){
        h+='<div class="result-item" onclick="App.doSearch(this.getAttribute(\'data-q\'))" data-q="'+esc(sh[i])+'">';
        h+='<div class="result-text">'+esc(sh[i])+'</div></div>';
      }
    }
    showPanel('search');window.scrollTo(0,0);
    document.getElementById('searchPage').innerHTML=h;
    return;
  }
  var ql=q.toLowerCase(),qa=normAr(q),sm=[],vr=[];
  for(var i=0;i<QD.length;i++){
    var s=QD[i];
    if(s._nl.indexOf(ql)>=0||String(s.number).indexOf(ql)>=0||(qa&&s._anl&&s._anl.indexOf(qa)>=0))sm.push(s);
    for(var j=0;j<s.verses.length;j++){
      var vv=s.verses[j];
      var matchTxt=vv._tl.indexOf(ql)>=0;
      var matchAr=qa&&vv._al&&vv._al.indexOf(qa)>=0;
      if(matchTxt||matchAr)vr.push({s:s,v:vv,ma:matchAr});
    }
  }
  var tot=sm.length+vr.length;
  h='<div class="search-pg-header"><h2 class="search-pg-title">«'+esc(q)+'» — \u043d\u0430\u0442\u0438\u0436\u0430\u043b\u0430\u0440</h2>';
  h+='<div class="search-pg-meta">'+tot+' \u0442\u0430 \u043d\u0430\u0442\u0438\u0436\u0430</div></div>';
  if(!tot){
    h+='<div class="no-results">\u04b2\u0435\u0447 \u043d\u0430\u0440\u0441\u0430 \u0442\u043e\u043f\u0438\u043b\u043c\u0430\u0434\u0438</div>';
  } else {
    if(sm.length){
      h+='<div class="section-label">\u0421\u0443\u0440\u0430 \u043d\u043e\u043c\u043b\u0430\u0440\u0438</div>';
      for(var i=0;i<sm.length;i++){
        var s=sm[i];
        h+='<div class="result-item" onclick="App.open('+s.number+')">';
        h+='<div class="result-label">'+s.number+'. '+esc(s.name)+' · '+s.verseCount+' \u043e\u044f\u0442</div>';
        h+='<div class="result-text" style="color:var(--text)">'+hl(s.name,q)+'</div></div>';
      }
    }
    if(vr.length){
      h+='<div class="section-label">\u041e\u044f\u0442\u043b\u0430\u0440 ('+vr.length+' \u0442\u0430)</div>';
      var lim=Math.min(vr.length,200);
      for(var i=0;i<lim;i++){
        var r=vr[i];
        var dt=r.v.text;var iz=dt.indexOf('\u0418\u0437\u043e\u04b3:');if(iz>=0)dt=dt.substring(0,iz).trim();
        h+='<div class="result-item" onclick="App.open('+r.s.number+',\''+esc(q)+'\',\''+esc(r.v.label)+'\')">';
        h+='<div class="result-label">'+r.s.number+'. '+esc(r.s.name)+' · '+esc(r.v.label)+'-\u043e\u044f\u0442</div>';
        if(r.ma&&r.v.ar)h+='<div class="result-text-ar" dir="rtl" lang="ar">'+esc(r.v.ar.substring(0,260))+'</div>';
        h+='<div class="result-text">'+hl(dt.substring(0,260),q)+'</div></div>';
      }
      if(vr.length>200){
        h+='<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:14px">';
        h+='\u0432\u0430 \u044f\u043d\u0430 '+(vr.length-200)+' \u0442\u0430</div>';
      }
    }
  }
  showPanel('search');window.scrollTo(0,0);
  document.getElementById('searchPage').innerHTML=h;
  if(q.length>=2&&sh.indexOf(q)<0){sh.unshift(q);if(sh.length>5)sh.pop();ss('sh',JSON.stringify(sh));}
}

function goHome(){curN=null;document.getElementById('searchInput').value='';buildGrid('');renderDailySection();showPanel('home');window.scrollTo(0,0);setHash('');}

function showPanel(p){
  document.getElementById('homePage').style.display=p==='home'?'block':'none';
  document.getElementById('suraPage').className=p==='sura'?'visible':'';
  document.getElementById('searchPage').className=p==='search'?'visible':'';
  document.getElementById('backBtn').className='back-btn'+(p==='search'?' visible':'');
  document.querySelector('header').classList.toggle('in-page',p!=='home');
  document.body.classList.toggle('in-sura',p==='sura');
  document.getElementById('progressBar').style.width='0%';
  var fb=document.getElementById('floatBar');
  if(fb)fb.classList.toggle('visible',p==='sura');
  var ft=document.getElementById('floatTheme');
  if(ft)ft.classList.toggle('visible',p==='sura');
  var fs=document.getElementById('floatSettings');
  if(fs)fs.classList.toggle('visible',p==='sura');
  if(p!=='sura'){var st=document.getElementById('scrollTop');if(st)st.classList.remove('visible');}
  closeSettings();
}

function setHash(h){if(navLock)return;navLock=true;try{location.hash=h;}finally{setTimeout(function(){navLock=false;},10);}}

function applyHash(){
  if(navLock)return;
  var h=location.hash.replace(/^#\/?/,'');
  if(!h){if(curN!==null||document.getElementById('searchPage').className.indexOf('visible')>=0)goHome();return;}
  var m=h.split('/');
  var n=parseInt(m[0],10);
  if(!n||n<1||n>114)return;
  var lbl=m[1]||'';
  navLock=true;
  try{openSura(n,'',lbl);}finally{setTimeout(function(){navLock=false;},10);}
}

function closeSettings(){
  var p=document.getElementById('settingsPop');if(p){p.classList.remove('show');p.classList.remove('bottom');}
  var b=document.getElementById('settingsBtn');if(b)b.setAttribute('aria-expanded','false');
}


document.getElementById('searchInput').addEventListener('input',function(e){
  clearTimeout(sT);var v=e.target.value.trim();
  sT=setTimeout(function(){App.doSearch(v);},300);
});

window.addEventListener('scroll',function(){
  if(curN){
    var el=document.getElementById('suraPage');
    if(el){
      var tot=el.offsetHeight-window.innerHeight;
      var pct=tot>0?Math.min(100,Math.max(0,(-el.getBoundingClientRect().top/tot)*100)):100;
      document.getElementById('progressBar').style.width=pct+'%';
    }
    var st=document.getElementById('scrollTop');
    if(st)st.classList.toggle('visible',window.scrollY>400);
  }
});

apTh();apFz();apAr();buildGrid('');renderDailySection();

document.addEventListener('click',function(e){
  var pop=document.getElementById('settingsPop');var btn=document.getElementById('settingsBtn');var fbtn=document.getElementById('floatSettings');
  if(!pop||!btn)return;
  if(pop.classList.contains('show')&&!pop.contains(e.target)&&!btn.contains(e.target)&&!(fbtn&&fbtn.contains(e.target)))closeSettings();
});

window.addEventListener('hashchange',applyHash);

if(location.hash){applyHash();}else{showPanel('home');}

return{
  open:openSura,
  goHome:goHome,
  toggleTheme:function(){th=th==='dark'?'light':'dark';ss('th',th);apTh();},
  toggleSettings:function(ev){if(ev)ev.stopPropagation();var p=document.getElementById('settingsPop');var b=document.getElementById('settingsBtn');var open=!p.classList.contains('show');if(open)p.classList.remove('bottom');p.classList.toggle('show',open);b.setAttribute('aria-expanded',open?'true':'false');},
  toggleSettingsF:function(ev){if(ev)ev.stopPropagation();var p=document.getElementById('settingsPop');var open=!p.classList.contains('show');if(open)p.classList.add('bottom');p.classList.toggle('show',open);var b=document.getElementById('settingsBtn');if(b)b.setAttribute('aria-expanded',open?'true':'false');},
  toggleAr:function(){showAr=!showAr;ss('ar',showAr?'1':'0');apAr();},
  iz:function(btn){var el=btn.nextElementSibling;if(!el)return;var s=el.classList.toggle('show');btn.textContent=s?'\u25b2 \u0418\u0437\u043e\u04b3\u043d\u0438 \u044f\u0448\u0438\u0440\u0438\u0448':'\u25bc \u0418\u0437\u043e\u04b3\u043d\u0438 \u043a\u045e\u0440\u0438\u0448';},
  dsc:function(btn){var el=document.getElementById('descCard');if(!el)return;var s=el.classList.toggle('show');btn.setAttribute('aria-expanded',s?'true':'false');var sp=btn.querySelector('span');if(sp)sp.textContent=s?'\u25b2 \u0422\u0430\u0432\u0441\u0438\u0444\u043d\u0438 \u044f\u0448\u0438\u0440\u0438\u0448':'\u25bc \u0422\u0430\u0432\u0441\u0438\u0444\u043d\u0438 \u045e\u049b\u0438\u0448';},
  jumpV:function(ev){if(ev)ev.preventDefault();var inp=document.getElementById('jumpInput');if(!inp||!curN)return;var n=parseInt(inp.value,10);var sura=gS(curN);if(!sura||!n||n<1||n>sura.verseCount){inp.value='';return;}var label=null;for(var i=0;i<sura.verses.length;i++){if(sura.verses[i].nums.indexOf(n)>=0){label=sura.verses[i].label;break;}}if(!label)return;var el=document.getElementById('v-'+label);if(!el)return;el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},1500);inp.value='';inp.blur();},
  fz:function(d){fz=Math.max(13,Math.min(28,fz+d));ss('fs',fz);apFz();},
  cp:function(n,lbl){var s=gS(n);if(!s)return;var v=null;for(var i=0;i<s.verses.length;i++)if(s.verses[i].label===lbl){v=s.verses[i];break;}if(!v)return;var t=(v.ar?v.ar+'\n\n':'')+v.text+'\n\n('+s.name+', '+lbl+'-оят)';copyText(t).then(function(){toast('Нусха олинди');});},
  doSearch:doSearch
};
})();


document.addEventListener('touchmove',function(e){if(e.touches.length>1){e.preventDefault();}},{passive:false});

if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});if('caches' in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}).catch(function(){});}}

</script>
