<script>
var App=(function(){
var _s={};
function sg(k,d){try{var v=localStorage.getItem(k);return v!==null?v:d;}catch(e){return _s[k]!==undefined?_s[k]:d;}}
function ss(k,v){try{localStorage.setItem(k,v);}catch(e){_s[k]=v;}}
var curN=null,curHw='',fz=parseInt(sg('fs','16'),10)||16,th=sg('th','dark');
var showAr=sg('ar','0')==='1';
var navLock=false;

function normAr(s){if(!s)return '';return s.replace(/[\u0610-\u061A\u064B-\u065F\u06D6-\u06DC\u06DF-\u06E4\u06E7\u06E8\u06EA-\u06ED\u0640\u0670\u200B-\u200F\u08D3-\u08FF\uFEFF]/g,'').replace(/[\u0622\u0623\u0625\u0671]/g,'\u0627').replace(/\u0621/g,'').replace(/\u0624/g,'\u0648').replace(/\u0626/g,'\u064A').replace(/\u0649/g,'\u0627').replace(/\u0629/g,'\u0647').replace(/[^\u0627-\u064A]/g,'');}

for(var qi=0;qi<QD.length;qi++){
  QD[qi]._nl=QD[qi].name.toLowerCase();
  if(QD[qi].nameAr)QD[qi]._anl=normAr(QD[qi].nameAr);
  var qvs=QD[qi].verses;
  for(var qj=0;qj<qvs.length;qj++){
    qvs[qj]._tl=qvs[qj].text.toLowerCase();
    if(qvs[qj].ar)qvs[qj]._al=normAr(qvs[qj].ar);
  }
}

var ICN={
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>',
  kaaba:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="6" width="14" height="14"/><line x1="5" y1="10" x2="19" y2="10" stroke-width="2.2"/></svg>',
  dome:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V14a7 7 0 0 1 14 0v5"/><line x1="3" y1="20" x2="21" y2="20"/><line x1="12" y1="5" x2="12" y2="7"/></svg>'
};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hl(t,q){
  if(!q)return esc(t);
  var s=esc(t);
  try{var re=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(re,'gi'),function(m){return '<mark>'+m+'</mark>';});}
  catch(e2){return s;}
}
function gS(n){for(var i=0;i<QD.length;i++)if(QD[i].number===n)return QD[i];return null;}
function apTh(){document.body.classList.toggle('light',th==='light');var ic=th==='light'?ICN.moon:ICN.sun;var btn=document.getElementById('themeBtn');if(btn)btn.innerHTML=ic;}
function apAr(){document.body.classList.toggle('hide-ar',!showAr);var b=document.getElementById('arToggleBtn');if(b){b.innerHTML=showAr?ICN.eyeOff:ICN.eye;b.title=showAr?'Араб матнини яшириш':'Араб матнини кўрсатиш';b.classList.toggle('on',showAr);}}
function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.className='toast show';clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast';},1800);}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);return Promise.resolve();}catch(e){return Promise.reject(e);}}
function suraLink(n){return location.origin+location.pathname+'#/'+n;}
function arFz(s){return Math.round(s*1.4);}
function apFz(){var els=document.querySelectorAll('.verse-text');for(var i=0;i<els.length;i++)els[i].style.fontSize=fz+'px';var ars=document.querySelectorAll('.verse-ar');var afz=arFz(fz);for(var k=0;k<ars.length;k++)ars[k].style.fontSize=afz+'px';var d=document.getElementById('fzDisplay');if(d)d.textContent=fz;}

var SURA_TYPE=['M','D','D','D','D','M','M','D','D','M','M','M','D','M','M','M','M','M','M','M','M','D','M','D','M','M','M','M','M','M','M','M','D','M','M','M','M','M','M','M','M','M','M','M','M','M','D','D','D','M','M','M','M','M','M','M','D','D','D','D','D','D','D','D','D','D','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','D','D','M','M','M','M','M','M','M','M','M','M','D','M','M','M','M'];

var SURA_JUZ=[1,1,3,4,6,7,8,9,10,11,11,12,13,13,14,14,15,15,16,16,17,17,18,18,18,19,19,20,20,21,21,21,21,22,22,22,23,23,23,24,24,25,25,25,25,26,26,26,26,26,26,27,27,27,27,27,27,28,28,28,28,28,28,28,28,28,29,29,29,29,29,29,29,29,29,29,29,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30];

function buildGrid(q){
  q=(q||'').toLowerCase().trim();
  var g=document.getElementById('suraGrid'),h='';
  var qa=normAr(q);
  var groups={},order=[],visible=0;
  for(var i=0;i<QD.length;i++){
    var s=QD[i];
    var ok=!q||s._nl.indexOf(q)>=0||String(s.number).indexOf(q)>=0||(s.nameTr&&s.nameTr.toLowerCase().indexOf(q)>=0)||(qa&&s._anl&&s._anl.indexOf(qa)>=0);
    if(!ok)continue;
    visible++;
    var jz=SURA_JUZ[s.number-1];
    if(!groups[jz]){groups[jz]=[];order.push(jz);}
    groups[jz].push(s);
  }
  if(!visible){g.innerHTML='<div class="no-results">\u04b2\u0435\u0447 \u043d\u0430\u0440\u0441\u0430 \u0442\u043e\u043f\u0438\u043b\u043c\u0430\u0434\u0438</div>';return;}
  for(var ji=0;ji<order.length;ji++){
    var jz=order[ji];
    h+='<div class="juz-section">';
    h+='<div class="juz-label">\u0416\u0443\u0437 '+jz+'</div>';
    h+='<div class="juz-group">';
    var ss=groups[jz];
    for(var k=0;k<ss.length;k++){
      var s=ss[k];
      var stypelabel=SURA_TYPE[s.number-1]==='M'?'\u041c\u0430\u043a\u043a\u0430':'\u041c\u0430\u0434\u0438\u043d\u0430';
      var page=s.page||'';
      h+='<a class="sura-card" data-num="'+s.number+'" href="#/'+s.number+'" onclick="event.preventDefault();App.open('+s.number+')">';
      h+='<div class="card-num">'+s.number+'</div>';
      h+='<div class="card-body">';
      h+='<div class="card-name"><span class="card-name-cy">'+esc(s.name)+'</span>';
      if(s.nameAr)h+='<span class="card-name-ar" dir="rtl" lang="ar">'+esc(s.nameAr)+'</span>';
      h+='</div>';
      h+='<div class="card-meta">'+stypelabel+' \u2014 '+s.verseCount+' \u043e\u044f\u0442</div>';
      h+='</div>';
      if(page)h+='<div class="card-page" aria-label="\u0411\u0435\u0442">'+page+'</div>';
      h+='</a>';
    }
    h+='</div></div>';
  }
  g.innerHTML=h;
}

function openSura(num,hw,scrollVerse){
  hw=hw||'';
  var sura=gS(num);
  if(!sura)return;
  curN=num;curHw=hw;
  showPanel('sura');
  function pV(t){
    var i=t.indexOf('Изоҳ:');
    return i<0?{m:t,iz:''}:{m:t.substring(0,i).trim(),iz:t.substring(i).trim()};
  }
  var vH='';
  for(var j=0;j<sura.verses.length;j++){
    var v=sura.verses[j];
    var p=pV(v.text);
    var hilit=(hw&&v.text.toLowerCase().indexOf(hw.toLowerCase())>=0)||(scrollVerse&&v.label===scrollVerse);
    var lbl=esc(v.label);
    vH+='<div class="verse'+(hilit?' highlighted':'')+'" id="v-'+lbl+'" data-lbl="'+lbl+'">';
    vH+='<button class="verse-num" type="button" onclick="App.cp('+num+',\''+lbl+'\')" aria-label="Нусха олиш" title="Нусха олиш"><span>'+lbl+'</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>';
    if(v.ar)vH+='<div class="verse-ar" dir="rtl" lang="ar" style="font-size:'+arFz(fz)+'px">'+esc(v.ar)+'</div>';
    vH+='<div class="verse-text" style="font-size:'+fz+'px">'+hl(p.m,hw)+'</div>';
    if(p.iz){
      vH+='<span class="izoh-toggle" onclick="App.iz(this)">▼ Изоҳни кўриш</span>';
      vH+='<div class="verse-izoh">'+esc(p.iz)+'</div>';
    }
    vH+='</div>';
  }
  var html='<div class="sura-pg-header">';
  if(sura.nameAr)html+='<div class="sura-pg-title-ar" dir="rtl" lang="ar">'+esc(sura.nameAr)+'</div>';
  html+='<h2 class="sura-pg-title">'+esc(sura.name)+' сураси</h2>';
  html+='<div class="sura-pg-meta"><span class="meta-pill">'+sura.verseCount+' оят</span>';
  html+='<div class="sura-pg-controls">';
  if(sura.description)html+='<button class="desc-toggle" type="button" onclick="App.dsc(this)" aria-expanded="false" aria-controls="descCard"><span>▼ Тавсифни ўқиш</span></button>';
  html+='<form class="jump-verse" onsubmit="App.jumpV(event)"><input id="jumpInput" type="number" min="1" max="'+sura.verseCount+'" placeholder="Оятга ўтиш" inputmode="numeric" aria-label="Оят рақами"><button type="submit" aria-label="Ўтиш">→</button></form>';
  html+='</div></div>';
  if(sura.description)html+='<div class="sura-pg-desc" id="descCard">'+esc(sura.description)+'</div>';
  html+='</div>';
  if(num!==9)html+='<div class="sura-pg-bismillah">&#x628;&#x650;&#x633;&#x652;&#x645;&#x650; &#x627;&#x644;&#x644;&#x647;&#x650; &#x627;&#x644;&#x631;&#x651;&#x62D;&#x652;&#x645;&#x670;&#x646;&#x650; &#x627;&#x644;&#x631;&#x651;&#x62D;&#x650;&#x64A;&#x652;&#x645;&#x650;</div>';
  html+='<div>'+vH+'</div>';
  document.getElementById('suraPage').innerHTML=html;
  if(scrollVerse){
    setTimeout(function(){var el=document.getElementById('v-'+scrollVerse);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});},80);
  }else{window.scrollTo(0,0);}
  setHash('/'+num+(scrollVerse?'/'+scrollVerse:''));
  apFnav();
}

function apFnav(){
  var p=document.getElementById('fnavPrev'),n=document.getElementById('fnavNext');
  if(!p||!n)return;
  var prev=curN&&curN>1?curN-1:0,next=curN&&curN<114?curN+1:0;
  p.disabled=!prev;n.disabled=!next;
  p.onclick=prev?function(){App.open(prev);}:null;
  n.onclick=next?function(){App.open(next);}:null;
}

var sT=null;
function renderVerseHits(q){
  var box=document.getElementById('verseHits');
  if(!box)return;
  if(!q||q.length<2){box.innerHTML='';return;}
  var ql=q.toLowerCase(),qa=normAr(q),vr=[];
  for(var i=0;i<QD.length;i++){
    var s=QD[i];
    for(var j=0;j<s.verses.length;j++){
      var vv=s.verses[j];
      var mt=vv._tl.indexOf(ql)>=0;
      var ma=qa&&vv._al&&vv._al.indexOf(qa)>=0;
      if(mt||ma)vr.push({s:s,v:vv,ma:ma});
    }
  }
  if(!vr.length){box.innerHTML='';return;}
  var h='<div class="section-label">Оятларда топилди ('+vr.length+' та)</div>';
  var lim=Math.min(vr.length,100);
  for(var i=0;i<lim;i++){
    var r=vr[i];
    var dt=r.v.text;var iz=dt.indexOf('Изоҳ:');if(iz>=0)dt=dt.substring(0,iz).trim();
    h+='<div class="result-item" onclick="App.open('+r.s.number+',\''+esc(q)+'\',\''+esc(r.v.label)+'\')">';
    h+='<div class="result-label">'+r.s.number+'. '+esc(r.s.name)+' · '+esc(r.v.label)+'-оят</div>';
    if(r.ma&&r.v.ar)h+='<div class="result-text-ar" dir="rtl" lang="ar">'+esc(r.v.ar.substring(0,260))+'</div>';
    h+='<div class="result-text">'+hl(dt.substring(0,260),q)+'</div></div>';
  }
  if(vr.length>lim)h+='<div class="hits-more">ва яна '+(vr.length-lim)+' та</div>';
  box.innerHTML=h;
}
function liveSearch(q){buildGrid(q);renderVerseHits(q);}

function goHome(){curN=null;document.getElementById('searchInput').value='';buildGrid('');renderVerseHits('');showPanel('home');window.scrollTo(0,0);setHash('');}

function showPanel(p){
  document.getElementById('homePage').style.display=p==='home'?'block':'none';
  document.getElementById('suraPage').className=p==='sura'?'visible':'';
  document.getElementById('backBtn').className='back-btn'+(p!=='home'?' visible':'');
  document.querySelector('header').classList.toggle('in-page',p!=='home');
  document.body.classList.toggle('in-sura',p==='sura');
  var fb=document.getElementById('floatBar');
  if(fb){fb.classList.toggle('visible',p==='sura');fb.classList.remove('scrolled-away');}
  _lastY=0;
  if(p!=='sura'){var st=document.getElementById('scrollTop');if(st)st.classList.remove('visible');}
  closeSettings();
}

function setHash(h){if(navLock)return;navLock=true;try{location.hash=h;}finally{setTimeout(function(){navLock=false;},10);}}

function applyHash(){
  if(navLock)return;
  var h=location.hash.replace(/^#\/?/,'');
  if(!h){if(curN!==null)goHome();return;}
  var m=h.split('/');
  var n=parseInt(m[0],10);
  if(!n||n<1||n>114)return;
  var lbl=m[1]||'';
  navLock=true;
  try{openSura(n,'',lbl);}finally{setTimeout(function(){navLock=false;},10);}
}

function closeSettings(){
  var p=document.getElementById('settingsPop');if(p){p.classList.remove('show');}
  var b=document.getElementById('settingsBtn');if(b)b.setAttribute('aria-expanded','false');
}


document.getElementById('searchInput').addEventListener('input',function(e){
  clearTimeout(sT);var v=e.target.value.trim();
  sT=setTimeout(function(){liveSearch(v);},200);
});

var _lastY=0;
window.addEventListener('scroll',function(){
  if(!curN)return;
  var y=window.scrollY;
  var st=document.getElementById('scrollTop');
  if(st)st.classList.toggle('visible',y>400);
  var fb=document.getElementById('floatBar');
