<style>
:root{
  --gold:#e8d08a;--gold-light:#f5e3a8;--gold-dark:#a8842c;--gold-deep:#6b4f10;
  --gold-grad:linear-gradient(135deg,#f5e3a8 0%,#c9a84c 45%,#8b6914 100%);
  --bg:#0a0612;--bg-deep:#050309;
  --aurora-1:#7c5af5;--aurora-2:#d4a84c;--aurora-3:#4cb4ff;--aurora-4:#ff6b9d;

  --glow-violet:0 0 28px rgba(124,90,245,0.22);
  --aurora-opacity:0.28
}
.light{
  --gold:#8b6914;--gold-light:#6b5010;--gold-dark:#4a3608;--gold-deep:#2a1f08;
  --gold-grad:linear-gradient(135deg,#a8842c 0%,#6b5010 50%,#3a2810 100%);
  --bg:#fbf6ec;--bg-deep:#f0e8d8;
  --aurora-1:#c4a8ff;--aurora-2:#ffd6a8;--aurora-3:#a8d4ff;--aurora-4:#ffc4d8;
  --surface:rgba(255,253,246,0.85);--surface-solid:#fff9ee;
  --surface2:rgba(252,247,232,0.92);--surface3:rgba(240,228,202,0.96);
  --border:rgba(110,80,30,0.22);--border2:rgba(120,85,15,0.5);
  --text:#1f1810;--text-dim:#4a3a26;--text-muted:#6a5840;
  --izoh:#234438;--izoh-bg:rgba(74,160,120,0.12);--izoh-border:rgba(48,128,88,0.6);
  --header-bg:rgba(251,246,236,0.85);

}
*{margin:0;padding:0;box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--gold-dark) transparent}
html::-webkit-scrollbar{width:10px;height:10px}
html::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold-dark),var(--gold));border-radius:10px;border:2px solid transparent;background-clip:padding-box}
body{background:var(--bg);color:var(--text);font-family:'Georgia','Playfair Display',serif;min-height:100vh;transition:background .4s,color .4s;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:-15%;z-index:-2;background:
  radial-gradient(ellipse 55% 45% at 18% 15%,var(--aurora-1) 0%,transparent 55%),
  radial-gradient(ellipse 50% 40% at 82% 22%,var(--aurora-2) 0%,transparent 60%),
  radial-gradient(ellipse 60% 50% at 50% 92%,var(--aurora-3) 0%,transparent 60%),
  radial-gradient(ellipse 40% 35% at 78% 75%,var(--aurora-4) 0%,transparent 55%);
  opacity:var(--aurora-opacity);filter:blur(60px) saturate(140%);pointer-events:none;animation:auroraDrift 36s ease-in-out infinite alternate}
@keyframes auroraDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(2%,-1%) scale(1.05)}100%{transform:translate(-2%,1%) scale(1)}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border-bottom:1px solid var(--border);height:58px;transition:background .4s}
.light header{box-shadow:0 1px 0 rgba(110,80,30,.06),0 4px 18px rgba(80,50,10,.05)}
.header-inner{max-width:1100px;width:100%;margin:0 auto;padding:0 14px;height:58px;display:flex;align-items:center;gap:10px}
.header-actions{margin-left:auto}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}

body.in-sura header{display:none}
body.in-sura .reading-progress{top:0}
.logo-text{font-size:14px;font-weight:700;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;letter-spacing:.01em}
.logo-sub{font-size:9px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.search-input{width:100%;background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--text);font-family:inherit;outline:none;transition:all .25s}
.search-input:focus{border-color:var(--gold-dark);background:var(--surface2);box-shadow:0 0 0 3px rgba(201,168,76,.12),var(--glow-gold)}
.search-input::placeholder{color:var(--text-muted)}
.light .icon-btn,.light .popover,.light .toast{box-shadow:0 2px 8px rgba(80,50,10,.06)}
.light .sura-card,.light .result-item,.light .continue-card,.light .daily-verse,.light .sura-pg-header,.light .home-search .search-input{box-shadow:0 2px 10px rgba(80,50,10,.06)}
.home-search{position:relative;max-width:640px;margin:6px auto 22px;padding:0 4px}
.home-search .search-input{height:54px;font-size:16px;padding:0 22px 0 52px;border-radius:14px;backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);box-shadow:0 4px 18px rgba(0,0,0,.14)}
.home-search .search-input:focus{box-shadow:0 0 0 3px rgba(201,168,76,.14),var(--glow-gold),0 6px 24px rgba(0,0,0,.18)}
.light .home-search .search-input:focus{box-shadow:0 0 0 3px rgba(139,105,20,.18),var(--glow-gold),0 4px 18px rgba(80,50,10,.1)}
.home-search .search-icon{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold-dark);pointer-events:none;opacity:.85}
@media(max-width:520px){.home-search{margin:4px auto 18px;padding:0 8px}.home-search .search-input{height:48px;font-size:15px;padding:0 18px 0 46px;border-radius:12px}.home-search .search-icon{left:18px;width:16px;height:16px}}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.icon-btn{background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--text-dim);width:34px;height:34px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;-webkit-tap-highlight-color:transparent;padding:0;flex-shrink:0;position:relative;transition:all .25s}
.icon-btn:hover,.icon-btn:active{border-color:var(--gold-dark);color:var(--gold);box-shadow:var(--glow-gold);transform:translateY(-1px)}
.icon-btn.active{border-color:var(--gold-dark);color:var(--gold)}
.icon-btn svg{width:15px;height:15px}
.popover{position:fixed;top:64px;right:14px;background:var(--surface2);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 16px 48px rgba(0,0,0,.45),var(--glow-violet);z-index:200;display:none;flex-direction:column;gap:14px;min-width:240px}
.light .popover{box-shadow:0 12px 36px rgba(60,40,10,.18)}
.popover.show{display:flex;animation:popIn .25s ease}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.popover-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.popover-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.14em}
.back-btn{display:none;align-items:center;gap:7px;background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--text);font-family:'Playfair Display',Georgia,serif;font-size:13px;padding:7px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .25s}
.back-btn .arrow{color:var(--gold);font-size:15px;line-height:1;font-family:Georgia,serif;transition:transform .2s}
.back-btn:hover{border-color:var(--gold-dark);background:var(--surface2);box-shadow:var(--glow-gold)}
.back-btn:hover .arrow{transform:translateX(-3px)}
.back-btn:active{border-color:var(--gold);color:var(--gold);transform:scale(.97)}
.back-btn.visible{display:inline-flex}
.fs-stepper{display:inline-flex;align-items:stretch;background:var(--surface2);border:1px solid var(--border);border-radius:9px;overflow:hidden;height:30px}
.fs-btn{background:transparent;border:0;color:var(--text-dim);width:30px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;padding:0;font-family:inherit;transition:all .15s}
.fs-btn:hover,.fs-btn:active{color:var(--gold);background:var(--surface3)}
.fs-display{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);min-width:34px;text-align:center;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:0 6px}
.ar-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);width:38px;height:30px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;padding:0;transition:all .2s}
.ar-toggle svg{width:15px;height:15px}
.ar-toggle:hover{border-color:var(--gold-dark);color:var(--gold)}
.ar-toggle.on{color:var(--gold);border-color:var(--gold-dark);background:var(--surface3);box-shadow:var(--glow-gold)}
/* ── HERO ── */
.hero{position:relative;text-align:center;padding:48px 20px 38px;margin:6px auto 22px;max-width:840px;overflow:hidden;border-radius:24px}
.hero-orb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,var(--aurora-2) 0%,var(--aurora-1) 40%,transparent 70%);filter:blur(64px);opacity:.32;pointer-events:none;z-index:0;animation:orbPulse 7s ease-in-out infinite alternate}
.light .hero-orb{opacity:.5}
@keyframes orbPulse{from{transform:translate(-50%,-50%) scale(.9)}to{transform:translate(-50%,-50%) scale(1.06)}}
@media(prefers-reduced-motion:reduce){.hero-orb{animation:none}}
.hero-inner{position:relative;z-index:1}
.hero-bismillah{font-family:'Scheherazade New','Amiri',serif;font-size:32px;line-height:1.7;direction:rtl;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;filter:drop-shadow(0 0 18px rgba(232,208,138,.25))}
.hero-title{font-family:'Playfair Display','Georgia',serif;font-size:44px;font-weight:600;line-height:1.1;letter-spacing:-.01em;background:linear-gradient(135deg,var(--text) 0%,var(--gold-light) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.hero-sub{font-family:'PT Serif',Georgia,serif;font-style:italic;font-size:15px;color:var(--text-dim);margin-bottom:24px;letter-spacing:.02em}
.hero-stats{display:inline-flex;align-items:center;gap:18px;background:var(--surface);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--border);border-radius:16px;padding:11px 22px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.light .hero-stats{box-shadow:0 4px 16px rgba(80,50,10,.08)}
.hero-stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.hero-stat strong{font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--gold);font-weight:600;letter-spacing:.02em}
.hero-stat span{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.16em;margin-top:3px}
.hero-stat-divider{width:1px;height:26px;background:var(--border)}
@media(max-width:520px){.hero{padding:34px 14px 28px}.hero-bismillah{font-size:26px}.hero-title{font-size:34px}.hero-sub{font-size:14px;margin-bottom:20px}.hero-stats{gap:14px;padding:10px 18px}.hero-stat strong{font-size:17px}.hero-orb{width:400px;height:400px}}
.sura-grid-wrap{padding:18px 12px 80px;max-width:1400px;margin:0 auto}
.grid-header{display:flex;align-items:center;justify-content:space-between;margin:4px 6px 14px}
.grid-title{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--text-muted)}
.grid-count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold-dark)}
.sura-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.sura-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media(min-width:1024px){.sura-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
#suraPage{display:none;max-width:720px;margin:0 auto;padding:28px 14px 120px;opacity:0;transition:opacity .35s ease}
#suraPage.visible{display:block;opacity:1}
.sura-pg-header{text-align:center;margin-bottom:28px;padding:26px 20px 22px;border-radius:20px;background:var(--surface);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--border);position:relative;overflow:hidden}
.sura-pg-header::before{content:'';position:absolute;top:-50%;left:-20%;right:-20%;height:100%;background:radial-gradient(ellipse at center,var(--aurora-2) 0%,transparent 60%);opacity:.2;filter:blur(40px);pointer-events:none}
.sura-pg-title-ar{position:relative;font-family:'Scheherazade New','Amiri','Traditional Arabic','Geeza Pro','Noto Naskh Arabic',serif;font-size:40px;direction:rtl;line-height:1.35;margin-bottom:8px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(232,208,138,.22))}
.sura-pg-title{position:relative;font-size:22px;color:var(--text);font-style:italic;margin-bottom:10px;letter-spacing:.01em;font-weight:500}
.sura-pg-meta{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px}
.meta-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase}
.sura-pg-bismillah{text-align:center;font-family:'Scheherazade New',serif;font-size:28px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:16px 0 22px;margin-bottom:6px;direction:rtl;line-height:1.7;filter:drop-shadow(0 0 14px rgba(232,208,138,.2))}
.sura-pg-desc{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-top:16px;font-family:'PT Serif',Georgia,serif;font-size:14px;line-height:1.78;color:var(--text-dim);display:none;white-space:pre-line;text-align:left}
.sura-pg-desc.show{display:block;animation:fadeSlide .3s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.desc-toggle{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);color:var(--gold-dark);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s}
.desc-toggle:hover,.desc-toggle:active{border-color:var(--gold-dark);color:var(--gold);background:var(--surface2);box-shadow:var(--glow-gold)}
.jump-verse{display:inline-flex;align-items:stretch;background:transparent;border:1px solid var(--border);border-radius:18px;overflow:hidden;height:30px}
.jump-verse input{background:transparent;border:0;color:var(--gold-dark);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;padding:0 12px;width:110px;outline:none;-moz-appearance:textfield;text-transform:uppercase}
.jump-verse input::-webkit-outer-spin-button,.jump-verse input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.jump-verse input::placeholder{color:var(--text-muted)}
.jump-verse button{background:var(--surface2);border:0;border-left:1px solid var(--border);color:var(--gold);font-family:inherit;font-size:14px;padding:0 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.jump-verse button:hover,.jump-verse button:active{color:var(--gold-light);background:var(--surface3)}
.verse.flash{background:rgba(232,208,138,.22)!important;box-shadow:var(--glow-gold);transition:background 1.4s,box-shadow 1.4s}
.reading-progress{position:fixed;top:58px;left:0;right:0;height:2px;z-index:99}
.reading-progress-bar{height:100%;background:linear-gradient(90deg,var(--aurora-1),var(--gold),var(--aurora-3));width:0%;transition:width .1s;box-shadow:0 0 12px rgba(232,208,138,.5)}
.verse{padding:16px 10px;border-radius:10px;margin:0 -8px 4px;border-bottom:1px solid var(--border);transition:background .2s,box-shadow .2s}
.verse::after{content:'';display:block;clear:both}
.verse:last-of-type{border-bottom:0}
.verse:active,.verse:hover{background:var(--surface)}
.verse.highlighted{background:var(--surface2);border:1px solid var(--border2);box-shadow:var(--glow-gold)}
.verse-num{float:left;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--gold-dark);border-radius:999px;padding:0 11px;margin:3px 13px 0 0;text-align:center;line-height:1;background:radial-gradient(circle at 35% 30%,rgba(232,208,138,.32),rgba(168,132,44,.06));cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .25s;font-weight:600;letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(232,208,138,.18)}
.verse-num:hover,.verse-num:active{border-color:var(--gold);color:var(--gold-light);background:radial-gradient(circle at 35% 30%,rgba(232,208,138,.5),rgba(232,208,138,.12));box-shadow:var(--glow-gold)}
.verse-ar{font-family:'Scheherazade New','Amiri','Traditional Arabic','Geeza Pro','Noto Naskh Arabic',serif;direction:rtl;text-align:right;font-size:22px;line-height:1.95;color:var(--text);margin-bottom:14px;padding-bottom:14px;font-weight:400;position:relative}
.verse-ar::after{content:'';position:absolute;left:20%;right:20%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.verse-text{font-family:'PT Serif',Georgia,'Playfair Display',serif;line-height:1.85;color:var(--text);letter-spacing:.005em}
.verse-text mark{background:linear-gradient(180deg,rgba(232,208,138,.32),rgba(232,208,138,.18));color:var(--gold-light);border-radius:3px;padding:1px 3px}

  <button type="button" class="float-bar-btn" id="fnavPrev" aria-label="Олдинги сура"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
  <button type="button" class="float-bar-btn" id="fnavHome" aria-label="Бош саҳифа" onclick="App.goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg></button>

</div>
<script src="data.js?v=20260503"></script>
<script>
var App=(function(){
var _s={};
function sg(k,d){try{var v=localStorage.getItem(k);return v!==null?v:d;}catch(e){return _s[k]!==undefined?_s[k]:d;}}
function ss(k,v){try{localStorage.setItem(k,v);}catch(e){_s[k]=v;}}
var curN=null,curHw='',fz=parseInt(sg('fs','16'),10)||16,th=sg('th','dark');
var showAr=sg('ar','0')==='1';
var sh=[];try{sh=JSON.parse(sg('sh','[]'));}catch(e){sh=[];}
var navLock=false;

function normAr(s){if(!s)return '';return s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[\u0622\u0623\u0625\u0671]/g,'\u0627').replace(/\u0649/g,'\u064A').replace(/\u0629/g,'\u0647');}

for(var qi=0;qi<QD.length;qi++){
  QD[qi]._nl=QD[qi].name.toLowerCase();
  if(QD[qi].nameAr)QD[qi]._anl=normAr(QD[qi].nameAr);
  var qvs=QD[qi].verses;
  for(var qj=0;qj<qvs.length;qj++){
    qvs[qj]._tl=qvs[qj].text.toLowerCase();
    if(qvs[qj].ar)qvs[qj]._al=normAr(qvs[qj].ar);
  }
}

var ICN={
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>',
  kaaba:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="6" width="14" height="14"/><line x1="5" y1="10" x2="19" y2="10" stroke-width="2.2"/></svg>',
  dome:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V14a7 7 0 0 1 14 0v5"/><line x1="3" y1="20" x2="21" y2="20"/><line x1="12" y1="5" x2="12" y2="7"/></svg>'
};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hl(t,q){
  if(!q)return esc(t);
  var s=esc(t);
  try{var re=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(re,'gi'),function(m){return '<mark>'+m+'</mark>';});}
  catch(e2){return s;}
}
function gS(n){for(var i=0;i<QD.length;i++)if(QD[i].number===n)return QD[i];return null;}
function apTh(){document.body.classList.toggle('light',th==='light');var ic=th==='light'?ICN.moon:ICN.sun;var btn=document.getElementById('themeBtn');if(btn)btn.innerHTML=ic;var ft=document.getElementById('floatTheme');if(ft)ft.innerHTML=ic;}
function apAr(){document.body.classList.toggle('hide-ar',!showAr);var b=document.getElementById('arToggleBtn');if(b){b.innerHTML=showAr?ICN.eyeOff:ICN.eye;b.title=showAr?'Араб матнини яшириш':'Араб матнини кўрсатиш';b.classList.toggle('on',showAr);}}
function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.className='toast show';clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast';},1800);}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);return Promise.resolve();}catch(e){return Promise.reject(e);}}
function suraLink(n){return location.origin+location.pathname+'#/'+n;}
function arFz(s){return Math.round(s*1.4);}
function apFz(){var els=document.querySelectorAll('.verse-text');for(var i=0;i<els.length;i++)els[i].style.fontSize=fz+'px';var ars=document.querySelectorAll('.verse-ar');var afz=arFz(fz);for(var k=0;k<ars.length;k++)ars[k].style.fontSize=afz+'px';var d=document.getElementById('fzDisplay');if(d)d.textContent=fz;}

var SURA_TYPE=['M','M','M','M','M','M','M','M','D','M','M','M','M','M','M','M','M','M','M','M','M','D','M','D','M','M','M','M','M','M','M','M','D','M','M','M','M','M','M','D','M','D','M','D','M','M','D','D','D','M','M','M','M','M','D','M','D','D','D','D','D','D','D','D','D','D','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','M','D','M','M','M','M','M','M','M','M','M','D','M','D','M','D','D','M'];

var DAILY_AYAHS=[
  {n:1,a:2},{n:1,a:5},
  {n:2,a:152},{n:2,a:153},{n:2,a:186},{n:2,a:201},{n:2,a:255},{n:2,a:286},
  {n:3,a:8},{n:3,a:26},{n:3,a:185},
  {n:6,a:162},{n:13,a:28},{n:14,a:7},{n:17,a:80},{n:18,a:10},
  {n:20,a:114},{n:23,a:118},{n:24,a:35},{n:25,a:74},
  {n:39,a:53},{n:40,a:60},{n:49,a:13},{n:55,a:13},
  {n:64,a:11},{n:65,a:3},{n:67,a:2},{n:73,a:8},
  {n:93,a:5},{n:94,a:5},{n:99,a:7},{n:103,a:1},
  {n:108,a:1},{n:112,a:1},{n:113,a:1},{n:114,a:1}
];
function findVerseByAyah(suraN,ayahN){var s=gS(suraN);if(!s)return null;for(var i=0;i<s.verses.length;i++){if(s.verses[i].nums.indexOf(ayahN)>=0)return{sura:s,verse:s.verses[i]};}return null;}
function saveLastRead(n,label){try{ss('lastRead',JSON.stringify({n:n,label:label||'',t:Date.now()}));}catch(e){}}
function getLastRead(){try{var v=sg('lastRead','');if(!v)return null;var p=JSON.parse(v);return(p&&p.n)?p:null;}catch(e){return null;}}
function dailyIndex(){var d=new Date();var st=new Date(d.getFullYear(),0,0);var diff=d.getTime()-st.getTime();var doy=Math.floor(diff/86400000);var L=DAILY_AYAHS.length;return((doy%L)+L)%L;}
function getDailyVerse(){var L=DAILY_AYAHS.length;for(var i=0;i<L;i++){var idx=(dailyIndex()+i)%L;var hit=findVerseByAyah(DAILY_AYAHS[idx].n,DAILY_AYAHS[idx].a);if(hit)return hit;}return null;}
function renderDailySection(){var sec=document.getElementById('dailySection');if(!sec)return;var h='';var last=getLastRead();if(last&&last.n){var ls=gS(last.n);if(ls){var lbl=last.label||'';var href='#/'+last.n+(lbl?'/'+lbl:'');var info='<strong>'+esc(ls.name)+'</strong> сураси';if(lbl)info+=' · '+esc(lbl)+'-оят';h+='<a class="continue-card" href="'+href+'" onclick="event.preventDefault();App.open('+last.n+',\'\',\''+esc(lbl)+'\')">';h+='<div class="continue-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></div>';h+='<div class="continue-body"><div class="continue-label">Давом эттиринг</div><div class="continue-info">'+info+'</div></div>';h+='<div class="continue-arrow" aria-hidden="true">→</div></a>';}}var d=getDailyVerse();if(d){var dt=d.verse.text;var iz=dt.indexOf('Изоҳ:');if(iz>=0)dt=dt.substring(0,iz).trim();var dhref='#/'+d.sura.number+'/'+d.verse.label;h+='<a class="daily-verse" href="'+dhref+'" onclick="event.preventDefault();App.open('+d.sura.number+',\'\',\''+esc(d.verse.label)+'\')">';h+='<span class="daily-verse-label">Кун ояти</span>';if(d.verse.ar)h+='<div class="daily-verse-ar" dir="rtl" lang="ar">'+esc(d.verse.ar)+'</div>';h+='<div class="daily-verse-text">'+esc(dt)+'</div>';h+='<div class="daily-verse-meta">'+esc(d.sura.name)+' · '+esc(d.verse.label)+'-оят <span class="arr" aria-hidden="true">→</span></div>';h+='</a>';}sec.innerHTML=h;}

function buildGrid(q){
  q=(q||'').toLowerCase().trim();
  var g=document.getElementById('suraGrid'),h='';
  for(var i=0;i<QD.length;i++){
    var s=QD[i],qa=normAr(q),ok=!q||s._nl.indexOf(q)>=0||String(s.number).indexOf(q)>=0||(s.nameTr&&s.nameTr.toLowerCase().indexOf(q)>=0)||(qa&&s._anl&&s._anl.indexOf(qa)>=0);
    var stype=SURA_TYPE[s.number-1]==='M'?'makki':'madani';
    var stypelabel=SURA_TYPE[s.number-1]==='M'?'\u041c\u0430\u043a\u043a\u0438\u0439':'\u041c\u0430\u0434\u0430\u043d\u0438\u0439';
    h+='<a class="sura-card'+(ok?'':' hidden')+'" data-num="'+s.number+'" data-type="'+stype+'" href="#/'+s.number+'" onclick="event.preventDefault();App.open('+s.number+')" style="animation-delay:'+(i%20*0.02)+'s">';
    h+='<div class="card-num-block"><span>'+s.number+'</span></div>';
    h+='<div class="card-inner">';
    h+='<div class="card-names">';
    if(s.nameAr)h+='<div class="card-name-ar">'+esc(s.nameAr)+'</div>';
    h+='<div class="card-name">'+esc(s.name)+'</div>';
    h+='</div>';
    h+='<div class="card-right">';
    h+='<span class="card-type-badge badge-'+stype+'">'+(stype==='makki'?ICN.kaaba:ICN.dome)+'<span>'+stypelabel+'</span></span>';
    h+='<span class="card-verses">'+s.verseCount+' \u043e\u044f\u0442</span>';
    h+='</div></div></a>';
  }
  g.innerHTML=h;
}

function openSura(num,hw,scrollVerse){
  hw=hw||'';
  var sura=gS(num);
  if(!sura)return;
  curN=num;curHw=hw;
  showPanel('sura');
  function pV(t){
    var i=t.indexOf('Изоҳ:');
    return i<0?{m:t,iz:''}:{m:t.substring(0,i).trim(),iz:t.substring(i).trim()};
  }
  var vH='';
  for(var j=0;j<sura.verses.length;j++){
    var v=sura.verses[j];
    var p=pV(v.text);
    var hilit=(hw&&v.text.toLowerCase().indexOf(hw.toLowerCase())>=0)||(scrollVerse&&v.label===scrollVerse);
    var lbl=esc(v.label);
    vH+='<div class="verse'+(hilit?' highlighted':'')+'" id="v-'+lbl+'" data-lbl="'+lbl+'">';
    vH+='<button class="verse-num" type="button" onclick="App.cp('+num+',\''+lbl+'\')" aria-label="Нусха олиш" title="Нусха олиш">'+lbl+'</button>';
    if(v.ar)vH+='<div class="verse-ar" dir="rtl" lang="ar" style="font-size:'+arFz(fz)+'px">'+esc(v.ar)+'</div>';
    vH+='<div class="verse-text" style="font-size:'+fz+'px">'+hl(p.m,hw)+'</div>';
    if(p.iz){
      vH+='<span class="izoh-toggle" onclick="App.iz(this)">▼ Изоҳни кўриш</span>';
      vH+='<div class="verse-izoh">'+esc(p.iz)+'</div>';
    }
    vH+='</div>';
  }
  var html='<div class="sura-pg-header">';
  if(sura.nameAr)html+='<div class="sura-pg-title-ar" dir="rtl" lang="ar">'+esc(sura.nameAr)+'</div>';
  html+='<h2 class="sura-pg-title">'+esc(sura.name)+' сураси</h2>';
  html+='<div class="sura-pg-meta"><span class="meta-pill">'+sura.verseCount+' оят</span>';
  if(sura.description)html+='<button class="desc-toggle" type="button" onclick="App.dsc(this)" aria-expanded="false" aria-controls="descCard"><span>▼ Тавсифни ўқиш</span></button>';
  html+='<form class="jump-verse" onsubmit="App.jumpV(event)"><input id="jumpInput" type="number" min="1" max="'+sura.verseCount+'" placeholder="Оятга ўтиш" inputmode="numeric" aria-label="Оят рақами"><button type="submit" aria-label="Ўтиш">→</button></form>';
  html+='</div>';
  if(sura.description)html+='<div class="sura-pg-desc" id="descCard">'+esc(sura.description)+'</div>';
  html+='</div>';
  if(num!==9)html+='<div class="sura-pg-bismillah">&#x628;&#x650;&#x633;&#x652;&#x645;&#x650; &#x627;&#x644;&#x644;&#x647;&#x650; &#x627;&#x644;&#x631;&#x651;&#x62D;&#x652;&#x645;&#x670;&#x646;&#x650; &#x627;&#x644;&#x631;&#x651;&#x62D;&#x650;&#x64A;&#x652;&#x645;&#x650;</div>';
  html+='<div>'+vH+'</div>';
  document.getElementById('suraPage').innerHTML=html;
  if(scrollVerse){
    setTimeout(function(){var el=document.getElementById('v-'+scrollVerse);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});},80);
  }else{window.scrollTo(0,0);}
  setHash('/'+num+(scrollVerse?'/'+scrollVerse:''));
  apFnav();
  saveLastRead(num,scrollVerse||'');
}

function apFnav(){
  var p=document.getElementById('fnavPrev'),n=document.getElementById('fnavNext');
  if(!p||!n)return;
  var prev=curN&&curN>1?curN-1:0,next=curN&&curN<114?curN+1:0;
  p.disabled=!prev;n.disabled=!next;
  p.onclick=prev?function(){App.open(prev);}:null;
  n.onclick=next?function(){App.open(next);}:null;
}

var sT=null;
function doSearch(q){
  if(!q){goHome();return;}
  var h='';
  if(q.length<2){
    h='<div class="search-pg-header"><h2 class="search-pg-title">\u049a\u0438\u0434\u0438\u0440\u0438\u0448 \u0442\u0430\u0440\u0438\u0445\u0438</h2></div>';
    if(!sh.length){
      h+='<div class="no-results">\u0422\u0430\u0440\u0438\u0445 \u0439\u045e\u049b</div>';
    } else {
      for(var i=0;i<sh.length;i++){
        h+='<div class="result-item" onclick="App.doSearch(this.getAttribute(\'data-q\'))" data-q="'+esc(sh[i])+'">';
        h+='<div class="result-text">'+esc(sh[i])+'</div></div>';
      }
    }
    showPanel('search');window.scrollTo(0,0);
    document.getElementById('searchPage').innerHTML=h;
    return;
  }
  var ql=q.toLowerCase(),qa=normAr(q),sm=[],vr=[];
  for(var i=0;i<QD.length;i++){
    var s=QD[i];
    if(s._nl.indexOf(ql)>=0||String(s.number).indexOf(ql)>=0||(qa&&s._anl&&s._anl.indexOf(qa)>=0))sm.push(s);
    for(var j=0;j<s.verses.length;j++){
      var vv=s.verses[j];
      var matchTxt=vv._tl.indexOf(ql)>=0;
      var matchAr=qa&&vv._al&&vv._al.indexOf(qa)>=0;
      if(matchTxt||matchAr)vr.push({s:s,v:vv,ma:matchAr});
    }
  }
  var tot=sm.length+vr.length;
  h='<div class="search-pg-header"><h2 class="search-pg-title">«'+esc(q)+'» — \u043d\u0430\u0442\u0438\u0436\u0430\u043b\u0430\u0440</h2>';
  h+='<div class="search-pg-meta">'+tot+' \u0442\u0430 \u043d\u0430\u0442\u0438\u0436\u0430</div></div>';
  if(!tot){
    h+='<div class="no-results">\u04b2\u0435\u0447 \u043d\u0430\u0440\u0441\u0430 \u0442\u043e\u043f\u0438\u043b\u043c\u0430\u0434\u0438</div>';
  } else {
    if(sm.length){
      h+='<div class="section-label">\u0421\u0443\u0440\u0430 \u043d\u043e\u043c\u043b\u0430\u0440\u0438</div>';
      for(var i=0;i<sm.length;i++){
        var s=sm[i];
        h+='<div class="result-item" onclick="App.open('+s.number+')">';
        h+='<div class="result-label">'+s.number+'. '+esc(s.name)+' · '+s.verseCount+' \u043e\u044f\u0442</div>';
        h+='<div class="result-text" style="color:var(--text)">'+hl(s.name,q)+'</div></div>';
      }
    }
    if(vr.length){
      h+='<div class="section-label">\u041e\u044f\u0442\u043b\u0430\u0440 ('+vr.length+' \u0442\u0430)</div>';
      var lim=Math.min(vr.length,200);
      for(var i=0;i<lim;i++){
        var r=vr[i];
        var dt=r.v.text;var iz=dt.indexOf('\u0418\u0437\u043e\u04b3:');if(iz>=0)dt=dt.substring(0,iz).trim();
        h+='<div class="result-item" onclick="App.open('+r.s.number+',\''+esc(q)+'\',\''+esc(r.v.label)+'\')">';
        h+='<div class="result-label">'+r.s.number+'. '+esc(r.s.name)+' · '+esc(r.v.label)+'-\u043e\u044f\u0442</div>';
        if(r.ma&&r.v.ar)h+='<div class="result-text-ar" dir="rtl" lang="ar">'+esc(r.v.ar.substring(0,260))+'</div>';
        h+='<div class="result-text">'+hl(dt.substring(0,260),q)+'</div></div>';
      }
      if(vr.length>200){
        h+='<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:14px">';
        h+='\u0432\u0430 \u044f\u043d\u0430 '+(vr.length-200)+' \u0442\u0430</div>';
      }
    }
  }
  showPanel('search');window.scrollTo(0,0);
  document.getElementById('searchPage').innerHTML=h;
  if(q.length>=2&&sh.indexOf(q)<0){sh.unshift(q);if(sh.length>5)sh.pop();ss('sh',JSON.stringify(sh));}
}

function goHome(){curN=null;document.getElementById('searchInput').value='';buildGrid('');renderDailySection();showPanel('home');window.scrollTo(0,0);setHash('');}

function showPanel(p){
  document.getElementById('homePage').style.display=p==='home'?'block':'none';
  document.getElementById('suraPage').className=p==='sura'?'visible':'';
  document.getElementById('searchPage').className=p==='search'?'visible':'';
  document.getElementById('backBtn').className='back-btn'+(p==='search'?' visible':'');
  document.querySelector('header').classList.toggle('in-page',p!=='home');
  document.body.classList.toggle('in-sura',p==='sura');
  document.getElementById('progressBar').style.width='0%';
  var fb=document.getElementById('floatBar');
  if(fb)fb.classList.toggle('visible',p==='sura');
  var ft=document.getElementById('floatTheme');
  if(ft)ft.classList.toggle('visible',p==='sura');
  var fs=document.getElementById('floatSettings');
  if(fs)fs.classList.toggle('visible',p==='sura');
  if(p!=='sura'){var st=document.getElementById('scrollTop');if(st)st.classList.remove('visible');}
  closeSettings();
}

function setHash(h){if(navLock)return;navLock=true;try{location.hash=h;}finally{setTimeout(function(){navLock=false;},10);}}

function applyHash(){
  if(navLock)return;
  var h=location.hash.replace(/^#\/?/,'');
  if(!h){if(curN!==null||document.getElementById('searchPage').className.indexOf('visible')>=0)goHome();return;}
  var m=h.split('/');
  var n=parseInt(m[0],10);
  if(!n||n<1||n>114)return;
  var lbl=m[1]||'';
  navLock=true;
  try{openSura(n,'',lbl);}finally{setTimeout(function(){navLock=false;},10);}
}

function closeSettings(){
  var p=document.getElementById('settingsPop');if(p){p.classList.remove('show');p.classList.remove('bottom');}
  var b=document.getElementById('settingsBtn');if(b)b.setAttribute('aria-expanded','false');
}


document.getElementById('searchInput').addEventListener('input',function(e){
  clearTimeout(sT);var v=e.target.value.trim();
  sT=setTimeout(function(){App.doSearch(v);},300);
});

window.addEventListener('scroll',function(){
  if(curN){
    var el=document.getElementById('suraPage');
    if(el){
      var tot=el.offsetHeight-window.innerHeight;
      var pct=tot>0?Math.min(100,Math.max(0,(-el.getBoundingClientRect().top/tot)*100)):100;
      document.getElementById('progressBar').style.width=pct+'%';
    }
    var st=document.getElementById('scrollTop');
    if(st)st.classList.toggle('visible',window.scrollY>400);
  }
});

apTh();apFz();apAr();buildGrid('');renderDailySection();

document.addEventListener('click',function(e){
  var pop=document.getElementById('settingsPop');var btn=document.getElementById('settingsBtn');var fbtn=document.getElementById('floatSettings');
  if(!pop||!btn)return;
  if(pop.classList.contains('show')&&!pop.contains(e.target)&&!btn.contains(e.target)&&!(fbtn&&fbtn.contains(e.target)))closeSettings();
});

window.addEventListener('hashchange',applyHash);

if(location.hash){applyHash();}else{showPanel('home');}

return{
  open:openSura,
  goHome:goHome,
  toggleTheme:function(){th=th==='dark'?'light':'dark';ss('th',th);apTh();},
  toggleSettings:function(ev){if(ev)ev.stopPropagation();var p=document.getElementById('settingsPop');var b=document.getElementById('settingsBtn');var open=!p.classList.contains('show');if(open)p.classList.remove('bottom');p.classList.toggle('show',open);b.setAttribute('aria-expanded',open?'true':'false');},
  toggleSettingsF:function(ev){if(ev)ev.stopPropagation();var p=document.getElementById('settingsPop');var open=!p.classList.contains('show');if(open)p.classList.add('bottom');p.classList.toggle('show',open);var b=document.getElementById('settingsBtn');if(b)b.setAttribute('aria-expanded',open?'true':'false');},
  toggleAr:function(){showAr=!showAr;ss('ar',showAr?'1':'0');apAr();},
  iz:function(btn){var el=btn.nextElementSibling;if(!el)return;var s=el.classList.toggle('show');btn.textContent=s?'\u25b2 \u0418\u0437\u043e\u04b3\u043d\u0438 \u044f\u0448\u0438\u0440\u0438\u0448':'\u25bc \u0418\u0437\u043e\u04b3\u043d\u0438 \u043a\u045e\u0440\u0438\u0448';},
  dsc:function(btn){var el=document.getElementById('descCard');if(!el)return;var s=el.classList.toggle('show');btn.setAttribute('aria-expanded',s?'true':'false');var sp=btn.querySelector('span');if(sp)sp.textContent=s?'\u25b2 \u0422\u0430\u0432\u0441\u0438\u0444\u043d\u0438 \u044f\u0448\u0438\u0440\u0438\u0448':'\u25bc \u0422\u0430\u0432\u0441\u0438\u0444\u043d\u0438 \u045e\u049b\u0438\u0448';},
  jumpV:function(ev){if(ev)ev.preventDefault();var inp=document.getElementById('jumpInput');if(!inp||!curN)return;var n=parseInt(inp.value,10);var sura=gS(curN);if(!sura||!n||n<1||n>sura.verseCount){inp.value='';return;}var label=null;for(var i=0;i<sura.verses.length;i++){if(sura.verses[i].nums.indexOf(n)>=0){label=sura.verses[i].label;break;}}if(!label)return;var el=document.getElementById('v-'+label);if(!el)return;el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},1500);inp.value='';inp.blur();},
  fz:function(d){fz=Math.max(13,Math.min(28,fz+d));ss('fs',fz);apFz();},
  cp:function(n,lbl){var s=gS(n);if(!s)return;var v=null;for(var i=0;i<s.verses.length;i++)if(s.verses[i].label===lbl){v=s.verses[i];break;}if(!v)return;var t=(v.ar?v.ar+'\n\n':'')+v.text+'\n\n('+s.name+', '+lbl+'-оят)';copyText(t).then(function(){toast('Нусха олинди');});},
  openRandom:function(){var n=Math.floor(Math.random()*114)+1;openSura(n);},
  doSearch:doSearch
};
})();


document.addEventListener('touchmove',function(e){if(e.touches.length>1){e.preventDefault();}},{passive:false});

if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});if('caches' in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}).catch(function(){});}}

</script>
